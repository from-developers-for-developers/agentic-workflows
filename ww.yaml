modes:
  - name: economy
    description:
      - Use as few tokens as possible.
      - Use concise descriptions and lighter reasoning where appropriate.

documents:
  - plan: >-
      The implementation plan a roadmap follows, kept current after every
      slice: which slices landed, which deviated, and what the remaining
      slices must do now.

handlers:
  - check-code-quality:
    model: cheapest
    reasoning: lowest
    loop:
      - run: >-
          Run `.venv/bin/python -m ruff check src tests scripts ext/ww/git`
          and `.venv/bin/python -m mypy` with no arguments (pyproject.toml
          names its targets), and fix what they report.
        break: Neither tool reports a finding.

  - run-tests:
    loop:
      - test: >-
          Run the whole suite with `scripts/test tests` (pytest alone, in
          parallel) and fix every failing test.
        break: >-
          No test fails because of this change; pre-existing or environmental
          failures are noted in the artifact.

  - update-documentation: >-
      Bring the documentation in line with this task's changes, editing only
      what they affect and leaving the rest as it is:
      documentation/architecture.md for architecture changes;
      documentation/features.md, one section per feature with examples, for
      new, changed, or removed features; documentation/specification.md for
      changes to the ww.yaml syntax; and README.md only for the tool's
      purpose, main examples, and setup, as an introduction rather than a
      reference.

  - update-agent-instructions: >-
      When the change alters how agents should invoke ww, update
      src/ww/assets/agent_instructions.md and the ww skill in
      src/ww/assets/ww_skill.md, and copy the instructions to
      WW_AGENT_INSTRUCTIONS.md. The instructions must stay under 50 lines.

  - update-changelog: >-
      When this task changed something (if something is changed) a user of main would notice, add one
      bullet to CHANGELOG.md under today's date heading, newest first, creating
      the heading if it is missing. Keep it to one or two lines: what changed
      for the user, not how it was built, with no examples or rationale. End
      it with the short hash of the task's commit in backticks, read with
      `git log -1 --format=%h` in the task's workspace. Add nothing for
      internal work such as refactoring or tests.

hooks:
  before_start_workflow:
    - workflows: [task, hotfix, auto-refactor, roadmap, express]
      handlers:
        - ext/ww/git/handlers:is-git-clean: ~
        - ext/ww/git/handlers:start-task-branch: ~
        - ext/ww/git/handlers:create-worktree: ~

  before_complete_workflow:
    - workflows: [task, hotfix, auto-refactor]
      handlers:
        - update-documentation: ~
        - update-agent-instructions: ~
        - ext/ww/git/handlers:git-commit: ~
        - update-changelog: ~
        - ext/ww/git/handlers:git-commit: ~

    - workflows: [express]
      handlers:
        - ext/ww/git/handlers:git-commit: ~

workflows:
  - express: Implement a change in one step, with fully automated development checks.
    steps:
      - develop: >-
          Research the request and implement the change, including relevant
          tests and documentation. Do not run the development checks yourself:
          ww runs formatting checks, lint, type checks, and the full test suite
          automatically when you complete this step. Fix any failures ww
          returns, then complete again. Do not create a .venv symlink.
        hooks:
          before_complete:
            - argv: [scripts/test]
              on_failure: fix
              on_failure_instruction: >-
                Fix the reported development-check failures. Complete the step
                again so ww reruns the checks automatically.

  - task: Implement a feature or a planned change, from research to a tested commit.
    steps:
      - develop: >-
          Research the codebase, analyse the request, and implement it. Do not
          run tests or linters: the workflow runs them next.
        role: manager

      - check-code-quality: ~
      - run-tests: ~

  - hotfix: The workflow for bugs that have to be released ASAP (critical/urgent/security issues).
    recommended_next_workflow: merge-to-dev
    steps:
      - investigate: >-
          Find out why the bug happens and under which circumstances. Reproduce
          it with a failing test where you can.

      - fix: Fix the bug at the cause the investigation found.
        artifact_from: investigate

      - check-code-quality: ~
      - run-tests: ~

  - bugfix: Copy of the hotfix workflow, but for bugfixes to be released via standard release process (dev --> main).
    inherit: hotfix

  # Works in the primary checkout with plain git: ww/git has no merge handler,
  # and its handlers would select the task's own worktree instead.
  - merge-to-dev: Merge a requested branch into dev and leave dev passing.
    steps:
      - merge: >-
          Merge the branch the task requirements name into dev, in the
          repository's primary checkout; if they name no branch, ask the
          operator which one. First make sure the checkout has no uncommitted
          changes, and note the branch it is on. Switch to dev, fast-forward it
          from its remote with `git pull --ff-only` when it has one, and run
          `git merge --no-ff <branch>`. Resolve every conflict so that the
          intent of both sides survives, then conclude the merge commit. In the
          artifact, list each conflicted file and how you resolved it. Do not
          push.
        role: manager

      # Only a non-trivial conflict resolution is new code worth reviewing.
      - assess:
          question: >-
            Did the merge resolve conflicts in non-trivial code, beyond
            imports, formatting, or changelog entries?
          outcomes:
            positive:
              steps:
                - review-resolutions: >-
                    Review each conflict resolution the merge artifact lists
                    against both branches: neither side's intent may be lost,
                    and no logic may be duplicated or dropped. Fix what is
                    wrong.

      - check-code-quality: ~
      - run-tests: ~

      - finish: >-
          If the quality and test rounds changed anything, commit it on dev as
          "{{ww.task.id}}: Fix the build after merging <branch>", naming the
          merged branch. Then switch the primary checkout back to the branch it
          was on before the merge. Do not push.
        artifact_from: merge

  # A roadmap implements a written plan slice by slice. The parent keeps the
  # plan as its task document and adds one child per slice. For each child in
  # turn, the parent refines the child's text, runs it as a `task` (which
  # branches from the roadmap's branch and commits there, without landing),
  # reviews it, merges it into the roadmap's branch, and reconciles the plan,
  # so every slice starts from the previous one. Review, landing and
  # reconciliation are the manager's own.
  - roadmap: >-
      Implement a written plan slice by slice: one child task per slice,
      each reviewed, landed on this task's branch, and reconciled with the
      plan.
    steps:
      - name: read-plan
        description: >-
          Read the plan file the requirements name and copy it to
          {{ww.documents.plan}}, adding a "Status" section with one line per
          slice, all "pending". Then add one child per slice, in the plan's
          order, with `add-child`: the text is the slice's full text
          as the plan gives it, not a reference to the slice. Nothing else.
        saves:
          - documents.plan: The copied plan with a Status section, one line per slice.
        children:
          description: One child per slice of the plan, with the slice's full text.
          steps:
            - refine: >-
                Rewrite this child's text, {{ww.child.text}}, with
                `update-child --text` so that it stands alone as the task's
                requirements: the slice's current text from
                {{ww.documents.plan}}, adjusted to what earlier slices actually
                landed as the plan's Status section records it; the plan's
                general rules that apply to every slice; the instruction to
                verify the plan's claims about the code before editing, to
                record each deviation in the develop artifact, to write the
                slice's tests and documentation as part of the change, and to
                build nothing from later slices; and the absolute path of
                {{ww.documents.plan}} for reference.
              role: manager

            - implement:
                workflow: task

            - name: review
              loop:
                - review-slice: >-
                    Review the diff of {{ww.child.git.branch}} against
                    {{ww.child.git.base_branch}}: does it do what the child's
                    text asks, meet the slice's acceptance criteria in
                    {{ww.documents.plan}}, and follow
                    documentation/python-agent-rules.md? List every finding as
                    file:line and what to change; an empty list accepts the
                    slice.
                  role: manager
                  break: There are no findings.

                - fix: >-
                    Apply every finding of the review artifact on
                    {{ww.child.git.branch}}, in the worktree that `git worktree
                    list` shows for that branch, not in this task's workspace.
                    Run ruff, mypy and the whole pytest suite there in their
                    least verbose mode that still shows every finding, fix
                    what they report, and commit on that branch with the
                    subject prefixed with {{ww.child.id}} followed by `: `, as
                    the child's own commits are.
                  artifact_from: review-slice
              max_rounds: 3

            - land: >-
                Merge {{ww.child.git.branch}} into {{ww.git.branch}} with
                `git merge --no-ff` in this task's workspace. Resolve every
                conflict so that the intent of both sides survives, then
                conclude the merge commit. Do not push. In the artifact, name
                the merge commit and list each conflicted file and how you
                resolved it.
              role: manager

            - reconcile: >-
                Update {{ww.documents.plan}}: mark this slice landed, or deviated
                with the deviations the child's develop artifact and the
                review record, and rewrite the remaining slices where this
                slice changed their premises: names, shapes, files, decisions.
                Implement nothing.
              artifact_from: implement
              role: manager
              saves:
                - documents.plan: The plan with this slice's status and the remaining slices reconciled.

      - close-plan: >-
          Mark the roadmap done in {{ww.documents.plan}}: which slices landed
          as written, which deviated and how, and what remains for a
          follow-up.
        saves:
          - documents.plan: The final status per slice and the list of deviations.

  - auto-refactor: >-
      Review the development since the last refactoring and reshape the
      architecture where it has drifted. Run it periodically.
    steps:
      - assess:
          question: >-
            Does the development since the last refactoring
            ({{ww.project_metadata.last_auto_refactored_at}}; empty means never)
            show code smells or architectural drift worth refactoring?

      - plan: Make a detailed plan of the refactoring, point by point.
      - refactor: Carry out the plan without changing behaviour.
        artifact_from: plan
        saves:
          - project_metadata.last_auto_refactored_at: The current time as YYYY-MM-DD HH:mm.

      - check-code-quality: ~
      - run-tests: ~
