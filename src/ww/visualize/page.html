async function loadTasks() {
  try {
    const data = await getJSON("/api/tasks");
    tasks = data.tasks;
  } catch (e) {
    $("#tlist").innerHTML = `<div class="empty">ww cannot read the task store: ${esc(e.message)}</div>`;
    return;
  }
  $("#tabTasksN").textContent = tasks.length;
  if (!currentTask || !tasks.some(t => t.id === currentTask)) {
    const fromHash = decodeURIComponent(location.hash.slice(1));
    const active = tasks.slice().reverse().find(t => isActive(t.status));
    currentTask = tasks.some(t => t.id === fromHash) ? fromHash : (active || tasks[tasks.length - 1] || {}).id || null;
  }
  renderChips(); renderTaskList(); renderCensus();
  await loadDetail();
}
async function loadDetail() {
  if (!currentTask) { detail = null; renderTaskDetail(); return; }
  const id = currentTask;
  const openPanels = $$("#tdetail .rules-panel:not([hidden]), #tdetail details[open]").map(n => n.id || null);
  const scroll = window.scrollY;
  try {
    const data = await getJSON("/api/task?id=" + encodeURIComponent(id));
    if (id !== currentTask) return;
    detail = data;
  } catch (e) {
    $("#tdetail").innerHTML = `<div class="empty">ww cannot read ${esc(id)}: ${esc(e.message)}</div>`;
    return;
  }
  renderTaskDetail();
  openPanels.forEach(pid => { const p = pid && document.getElementById(pid); if (p) p.hidden = false; });
  window.scrollTo(0, scroll);
}
function selectTask(id) {
  currentTask = id; detail = null;
  try { history.replaceState(null, "", "#" + encodeURIComponent(id)); } catch (e) {}
  showView("tasks");
  renderTaskList(); renderTaskDetail(); loadDetail();
  if (matchMedia("(max-width: 980px)").matches) $("#tdetail").scrollIntoView({ block: "start" });
}

/* ---------- artifact drawer ---------- */
function md(src, options = {}) {
  const lines = src.replace(/\r/g, "").split("\n"); let html = "", list = null, code = null, para = [];
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
  // ww's pages break lines on purpose; an artifact's paragraphs may wrap.
  const flushP = () => { if (para.length) { html += `<p>${para.map(inline).join(options.breaks ? "<br>" : " ")}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const l of lines) {
    if (code !== null) { if (/^\s*```/.test(l)) { html += `<pre><code>${esc(code)}</code></pre>`; code = null; } else code += l + "\n"; continue; }
    if (/^\s*```/.test(l)) { flushP(); flushL(); code = ""; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { flushP(); flushL(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    const quote = l.match(/^>\s?(.*)/);
    if (quote) { flushP(); flushL(); html += `<blockquote>${inline(quote[1])}</blockquote>`; continue; }
    const li = l.match(/^\s*([-*]|\d+\.)\s+(.*)/);
    if (li) { flushP(); const k = /\d/.test(li[1]) ? "ol" : "ul"; if (list !== k) { flushL(); html += `<${k}>`; list = k; } html += `<li>${inline(li[2])}</li>`; continue; }
    if (!l.trim()) { flushP(); flushL(); continue; }
    if (list && /^\s{2,}/.test(l)) { html = html.replace(/<\/li>$/, " " + inline(l.trim()) + "</li>"); continue; }
    flushL(); para.push(l.trim());
  }
  if (code !== null) html += `<pre><code>${esc(code)}</code></pre>`;
  flushP(); flushL();
  return html;
}
async function openArtifact(i) { return openDrawer(artifactIndex[i]); }
async function openDrawer(a) {
  const drawer = $("#drawer");
  drawer.innerHTML = `<div class="drawer-head"><div style="min-width:0"><b>${esc(a.title)}</b><span class="path">${esc(a.ref)}</span></div><button class="x" type="button" data-close aria-label="Close">✕</button></div><div class="md"><p class="quiet">Loading…</p></div>`;
  drawer.hidden = false; $("#scrim").hidden = false;
  $(".x", drawer).focus();
  try {
    const url = a.doc
      ? `/api/document?name=${encodeURIComponent(a.doc)}${a.task ? `&task=${encodeURIComponent(a.task)}` : ""}`
      : `/api/artifact?task=${encodeURIComponent(a.task)}&run=${encodeURIComponent(a.run)}&ref=${encodeURIComponent(a.ref)}`;
    const response = await fetch(url, { cache: "no-store" });
    const text = await response.text();
    if (!response.ok) throw new Error(JSON.parse(text).error);
    $(".md", drawer).innerHTML = a.doc || /\.md$/.test(a.ref) ? md(text) : `<pre>${esc(text)}</pre>`;
  } catch (e) {
    $(".md", drawer).innerHTML = `<p class="quiet">ww cannot read the artifact: ${esc(e.message)}</p>`;
  }
}
function closeArtifact() { $("#drawer").hidden = true; $("#scrim").hidden = true; }

/* ================================================================
   Demo player: replays a run ww really made, command by command
================================================================ */
const player = { frame: 0, playing: false, speed: 1, timer: null, typed: 0 };
const ROLE_LABEL = { manager: "the agent, as manager", agent: "the agent, as worker" };
function demoSteps() { return (demoData.workflow.steps || []).map(st => st.path); }
function stepRounds(upTo) {
  const rounds = {};
  let last = null;
  demoData.frames.slice(0, upTo + 1).forEach(f => { if (f.step && f.step !== last) { rounds[f.step] = (rounds[f.step] || 0) + 1; } last = f.step; });
  return rounds;
}
function openPlayer() {
  if (!demoData) return;
  $("#player").hidden = false;
  document.body.classList.add("no-scroll");
  player.frame = 0; renderPlayer(true); play(true);
}
function closePlayer() {
  pause(); $("#player").hidden = true; document.body.classList.remove("no-scroll");
}
function renderPlayer(fresh) {
  const frames = demoData.frames, f = frames[player.frame];
  const steps = demoSteps(), rounds = stepRounds(player.frame);
  const reached = new Set(frames.slice(0, player.frame + 1).map(x => x.step));
  const done = f.status === "completed";
  const rail = steps.map(st => {
    const node = (demoData.workflow.steps || []).find(x => x.path === st);
    const K = KINDS[node.kind] || KINDS.worker;
    const state = f.step === st ? "now" : done || (reached.has(st) && steps.indexOf(st) < steps.indexOf(f.step)) ? "done" : reached.has(st) ? "seen" : "";
    return `<li class="p-step ${state}" style="--c:${K.color}"><span class="p-dot"></span><span class="p-name">${esc(st)}</span>${rounds[st] > 1 ? `<span class="round">round ${rounds[st]}</span>` : ""}<span class="p-kind">${esc(K.label)}</span></li>`;
  }).join("");
  const dots = frames.map((x, i) => `<button type="button" class="p-tick${i === player.frame ? " now" : i < player.frame ? " past" : ""}${x.refused ? " refused" : ""}" data-frame="${i}" aria-label="Step ${i + 1}"></button>`).join("");
  const filesHtml = f.files.map(file => `<div class="p-file"><div class="p-file-head">${ICON.save} writes <span class="mono">${esc(file.path)}</span></div><pre>${esc(file.content)}</pre></div>`).join("");
  const automatic = f.automatic.map(a => `<div class="p-auto">${ICON.gear} ww ran <b class="mono">${esc(a.name)}</b> by itself${a.result ? `: <span class="mono">${esc(a.result)}</span>` : ""}</div>`).join("");
  $("#player").innerHTML = `<div class="p-shell">
    <header class="p-top">
      <div><div class="eyebrow"><span>ww · demo</span><span class="dot"></span><span>${esc(demoData.root)}</span></div><h2>What an agent sees</h2></div>
      <button class="x" type="button" data-close-player aria-label="Close">✕</button>
    </header>
    <div class="p-grid">
      <aside class="p-side">
        <p class="section-label"><span>demo workflow</span><span>${player.frame + 1} / ${frames.length}</span></p>
        <ol class="p-rail">${rail}</ol>
        <p class="p-note">Every command and page here is ww's real output, recorded by running this workflow in a throwaway copy of the project.</p>
      </aside>
      <section class="p-main">
        <p class="p-say">${esc(f.say)}</p>
        ${filesHtml}
        <div class="term">
          <div class="term-bar"><i></i><i></i><i></i><span>${esc(ROLE_LABEL[f.role] || f.role)}</span></div>
          <div class="term-line"><span class="term-prompt">$</span> <span class="term-cmd" id="termCmd"></span><span class="caret"></span></div>
        </div>
        ${f.refused ? '<div class="p-refused">ww refused the completion: the step stays open until the check passes.</div>' : ""}
        ${automatic}
        <div class="p-page" id="pPage"${fresh ? " hidden" : ""}><div class="p-page-head">ww prints</div><div class="md">${md(f.output, { breaks: true })}</div></div>
      </section>
    </div>
    <footer class="p-controls">
      <button type="button" class="pbtn" data-player="restart" title="Restart (Home)">${ICON.restart}</button>
      <button type="button" class="pbtn" data-player="prev" title="Previous (←)">${ICON.prev}</button>
      <button type="button" class="pbtn main" data-player="toggle" title="Play or pause (space)">${player.playing ? ICON.pause : ICON.play}</button>
      <button type="button" class="pbtn" data-player="next" title="Next (→)">${ICON.next}</button>
      <div class="p-ticks">${dots}</div>
      <button type="button" class="pbtn speed" data-player="speed" title="Speed">${player.speed}×</button>
    </footer>
  </div>`;
  typeCommand(f.command, fresh);
}
function typeCommand(text, animate) {
  const el = $("#termCmd"), page = $("#pPage");
  clearTimeout(player.typing);
  if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { el.textContent = text; if (page) page.hidden = false; return; }
  let i = 0;
  const step = () => {
    i = Math.min(text.length, i + Math.max(1, Math.round(2 * player.speed)));
    el.textContent = text.slice(0, i);
    if (i < text.length) player.typing = setTimeout(step, 18);
    else player.typing = setTimeout(() => { if (page) { page.hidden = false; page.classList.add("rise"); } }, 350 / player.speed);
  };
  el.textContent = ""; step();
}
function dwell(f) {
  const base = 2200 + f.command.length * 18 + Math.min(f.output.length, 2400) * 2.2 + f.files.length * 1500;
  return Math.min(base, 12000) / player.speed;
}
function schedule() {
  clearTimeout(player.timer);
  if (!player.playing) return;
  const f = demoData.frames[player.frame];
  player.timer = setTimeout(() => {
    if (player.frame >= demoData.frames.length - 1) { pause(); return; }
    player.frame++; renderPlayer(true); schedule();
  }, dwell(f));
}
function play(fromStart) { player.playing = true; if (!fromStart) renderPlayer(false); schedule(); }
function pause() { player.playing = false; clearTimeout(player.timer); const b = $('[data-player="toggle"]'); if (b) b.innerHTML = ICON.play; }
function goFrame(i, animate) {
  player.frame = Math.max(0, Math.min(demoData.frames.length - 1, i));
  renderPlayer(animate); schedule();
}
function playerAction(action) {
  if (action === "toggle") { if (player.playing) pause(); else { if (player.frame >= demoData.frames.length - 1) player.frame = 0; player.playing = true; renderPlayer(true); schedule(); } return; }
  if (action === "prev") return goFrame(player.frame - 1, false);
  if (action === "next") return goFrame(player.frame + 1, true);
  if (action === "restart") { player.playing = true; return goFrame(0, true); }
  if (action === "speed") { player.speed = player.speed === 1 ? 1.5 : player.speed === 1.5 ? 2 : player.speed === 2 ? 0.75 : 1; const b = $('[data-player="speed"]'); if (b) b.textContent = player.speed + "×"; schedule(); }
}
async function loadDemo() {
  try { demoData = await getJSON("/api/demo"); } catch (e) { demoData = null; return; }
  Object.assign(demoData.workflow, { __key: "ww-demo", __demo: true });
  if (atlas) renderAtlas();
}

/* ================================================================
   Shell: census, views, live updates
================================================================ */
function renderCensus() {
  if (!atlas) return;
  const own = atlas.workflows.filter(w => !w.builtin);
  const steps = own.reduce((n, w) => n + countSteps(w), 0);
  const rules = (atlas.library.rules || { groups: [] }).groups.reduce((n, g) => n + g.rules.length, 0);
  const active = tasks.filter(t => isActive(t.status)).length;
  $("#census").innerHTML = [[own.length, "workflows"], [steps, "steps"], [(atlas.library.handlers || []).length, "handlers"], [rules, "rules"], [tasks.length, "tasks"], [active, "active"]]
    .map(([n, l]) => `<span><b>${n}</b>${l}</span>`).join("");
}
function showView(v) {
  $$(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.view === v));
  $("#view-workflows").hidden = v !== "workflows";
  $("#view-tasks").hidden = v !== "tasks";
  store.set("view", v);
  if (v === "workflows") $$(".wf.open").forEach(drawArcs);
}
async function loadAtlas() {
  try {
    const data = await getJSON("/api/atlas");
    if (atlas) data.__open = openCards();
    atlas = data;
  } catch (e) {
    $("#catalog").innerHTML = `<div class="empty">ww cannot build the workflows: ${esc(e.message)}</div>`;
    return;
  }
  const name = atlas.root.split("/").filter(Boolean).pop() || "ww";
  document.title = `${name} · ww`;
  $("#title").textContent = name;
  $("#eyebrow").innerHTML = `<span>ww · visualize</span><span class="dot"></span><span>${esc(atlas.root)}</span>${atlas.files.length ? `<span class="dot"></span><span>${esc(atlas.files.join(", "))}</span>` : ""}`;
  renderAtlas();
  if (currentTask && detail) renderTaskDetail();
  if (loadAtlas.after) { const after = loadAtlas.after; loadAtlas.after = null; after(); }
}
function connect() {
  const live = $("#live"), text = $("#liveText");
  const source = new EventSource("/api/events");
  source.addEventListener("hello", () => { live.classList.remove("off"); text.textContent = "Live · following the configuration and .ww/tasks"; });
  source.addEventListener("change", e => {
    const change = JSON.parse(e.data);
    if (change.config) loadAtlas();
    if (change.tasks) loadTasks();
  });
  source.onerror = () => { live.classList.add("off"); text.textContent = "Not connected · is ww visualize still running?"; };
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) { showView(tab.dataset.view); return; }
  if (e.target.closest("[data-play-demo]")) { openPlayer(); return; }
  if (e.target.closest("[data-close-player]") || e.target.id === "player") { closePlayer(); return; }
  const pb = e.target.closest("[data-player]"); if (pb) { playerAction(pb.dataset.player); return; }
  const tick = e.target.closest("[data-frame]"); if (tick) { pause(); goFrame(+tick.dataset.frame, false); return; }
  const seg = e.target.closest(".wf-switch .seg"); if (seg && !seg.disabled) {
    const card = seg.closest(".wf"), pane = seg.dataset.pane;
    $$(".wf-switch .seg", card).forEach(b => b.setAttribute("aria-selected", b === seg));
    $$(".wf-pane", card).forEach(p => { p.hidden = p.dataset.pane !== pane; });
    const keep = new Set(store.get("yaml", [])); if (pane === "yaml") keep.add(card.dataset.name); else keep.delete(card.dataset.name);
    store.set("yaml", [...keep]);
    drawArcs(card);
    return;
  }
  const cp = e.target.closest("[data-copy-yaml]"); if (cp) {
    const text = (wfByName[cp.closest(".wf").dataset.name] || {}).yaml;
    if (text && navigator.clipboard) navigator.clipboard.writeText(text.text).then(() => { cp.textContent = "Copied"; setTimeout(() => { cp.textContent = "Copy"; }, 1500); }, () => {});
    return;
  }
  const head = e.target.closest(".wf-head"); if (head && head.tagName === "BUTTON") { const c = head.closest(".wf"); setOpen(c, !c.classList.contains("open")); saveOpen(); return; }
  const g = e.target.closest("[data-goto]"); if (g) { goTo(g.dataset.goto); return; }
  const wo = e.target.closest("[data-wfopen]"); if (wo) { showView("workflows"); goTo(wo.dataset.wfopen); return; }
  const tr = e.target.closest("[data-task]"); if (tr) { selectTask(tr.dataset.task); return; }
  const ch = e.target.closest("[data-filter]"); if (ch) { taskFilter = ch.dataset.filter; store.set("taskFilter", taskFilter); renderChips(); renderTaskList(); return; }
  const ar = e.target.closest("[data-art]"); if (ar) { openArtifact(+ar.dataset.art); return; }
  const dc = e.target.closest("[data-doc]"); if (dc) { openDrawer({ doc: dc.dataset.doc, task: dc.dataset.docTask || null, ref: `documents.${dc.dataset.doc}`, title: dc.dataset.docTitle }); return; }
  if (e.target.closest("[data-close]") || e.target.id === "scrim") { closeArtifact(); return; }
  const t = e.target.closest("[data-toggle]"); if (t) { const p = document.getElementById(t.dataset.toggle); if (p) { p.hidden = !p.hidden; t.setAttribute("aria-expanded", !p.hidden); } return; }
  const m = e.target.closest("[data-clamp]"); if (m) { const d = document.getElementById(m.dataset.clamp); const c = d.classList.toggle("clamp"); m.textContent = c ? "Read all" : "Show less"; }
});
document.addEventListener("toggle", e => {
  const shelf = e.target.closest && e.target.closest("details.shelf");
  if (shelf) store.set("shelves", $$("details.shelf[open]").map(d => d.dataset.shelf));
}, true);
document.addEventListener("keydown", e => {
  if (!$("#player").hidden) {
    if (e.key === "Escape") closePlayer();
    else if (e.key === " ") { e.preventDefault(); playerAction("toggle"); }
    else if (e.key === "ArrowRight") playerAction("next");
    else if (e.key === "ArrowLeft") playerAction("prev");
    else if (e.key === "Home") playerAction("restart");
    return;
  }
  if (e.key === "Escape" && !$("#drawer").hidden) closeArtifact();
});
$("#expandAll").onclick = () => { $$(".wf:not([hidden])").forEach(c => setOpen(c, true)); saveOpen(); };
$("#collapseAll").onclick = () => { $$(".wf").forEach(c => setOpen(c, false)); saveOpen(); };
$("#toggleRules").onclick = e => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  e.currentTarget.textContent = on ? "Rules shown" : "Rules hidden";
  $("#catalog").classList.toggle("hide-rules", !on);
};
$("#toggleBuiltin").onclick = () => toggleBuiltin(!showBuiltin);
$("#q").addEventListener("input", applyFilters);
$("#tq").addEventListener("input", renderTaskList);
toggleBuiltin(showBuiltin);

const hash = decodeURIComponent(location.hash.slice(1));
showView(hash.startsWith("wf-") ? "workflows" : hash ? "tasks" : store.get("view", "workflows"));
if (hash.startsWith("wf-")) loadAtlas.after = () => goTo(hash.slice(3));
loadAtlas().then(loadTasks).then(connect);
loadDemo();
</script>
