<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ww</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an atlas — a catalog column of workflow cards that unfold into a step rail
   (with goto arcs drawn in its left gutter), beside a quiet library column. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --sunken: #EBEEF3;
  --ink: #131A2C;
  --muted: #5B6579;
  --faint: #8A93A6;
  --line: #DCE1E9;
  --accent: #2E44C2;
  --accent-soft: #E3E7FB;

  --k-worker: #2E44C2;
  --k-manager: #8B3D9E;
  --k-auto: #0E7C74;
  --k-workflow: #A86400;
  --k-assess: #B54A17;
  --k-items: #457519;
  --k-group: #6A7387;
  --k-hook: #6A7387;
  --rule: #55617E;
  --rule-soft: #ECEEF4;
  --demo: #9A6B00;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --term-bg: #10172A; --term-fg: #E3E8F2; --term-dim: #7E89A3; --y-key: #8FB3FF; --y-lit: #F0B357; --y-var: #6FD3C7;
  --r: 12px;
  --shadow: 0 1px 2px rgb(19 26 44 / .05), 0 10px 32px -16px rgb(19 26 44 / .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1220; --surface: #141A2A; --sunken: #1A2134; --ink: #E5E9F2; --muted: #9AA3B8; --faint: #6E7891;
    --line: #262E45; --accent: #93A3FF; --accent-soft: #222B4D;
    --k-worker: #93A3FF; --k-manager: #D79BE6; --k-auto: #5CCFC3; --k-workflow: #F0B357; --k-assess: #F59569;
    --k-items: #9BD161; --k-group: #8F98AD; --k-hook: #8F98AD; --rule: #A9B3CC; --rule-soft: #1E2539; --demo: #E9B949;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 32px -16px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1220; --surface: #141A2A; --sunken: #1A2134; --ink: #E5E9F2; --muted: #9AA3B8; --faint: #6E7891;
  --line: #262E45; --accent: #93A3FF; --accent-soft: #222B4D;
  --k-worker: #93A3FF; --k-manager: #D79BE6; --k-auto: #5CCFC3; --k-workflow: #F0B357; --k-assess: #F59569;
  --k-items: #9BD161; --k-group: #8F98AD; --k-hook: #8F98AD; --rule: #A9B3CC; --rule-soft: #1E2539; --demo: #E9B949;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 32px -16px rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code, .mono { font-family: var(--f-mono); font-size: .86em; }

.wrap {
  max-width: 1260px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Header ---------- */
header.top { padding-block: 44px 0; border-bottom: 1px solid var(--line); }
.eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
h1 {
  font-family: var(--f-display); font-weight: 750; font-size: clamp(34px, 5vw, 54px);
  line-height: 1.02; letter-spacing: -.025em; margin: 16px 0 12px; text-wrap: balance;
}
h1 .slash { color: var(--faint); font-weight: 500; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.census { display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 26px; font-variant-numeric: tabular-nums; }
.census span { color: var(--muted); font-size: 14px; }
.census b { font-family: var(--f-display); font-weight: 650; font-size: 20px; color: var(--ink); margin-right: 5px; }

/* ---------- Toolbar ---------- */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.toolbar .wrap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-block: 12px; }
.search {
  flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px;
}
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
.search svg { flex: none; color: var(--faint); }
.tbtn {
  font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.tbtn:hover { border-color: var(--faint); }
.tbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* ---------- Main grid ---------- */
main.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; padding-block: 34px 72px; align-items: start; }
@media (max-width: 980px) { main.wrap { grid-template-columns: minmax(0, 1fr); } }
.section-label {
  font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 14px; display: flex; justify-content: space-between; gap: 8px;
}

/* ---------- Workflow cards ---------- */
.catalog { display: grid; gap: 18px; min-width: 0; }
.wf { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; transition: box-shadow .2s, border-color .2s; }
.wf.open { box-shadow: var(--shadow); }
.wf-head { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; width: 100%; text-align: left; padding: 22px 24px; align-items: start; }
.wf-name { font-family: var(--f-display); font-weight: 650; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; line-height: 1.25; }
.wf-desc { grid-column: 1 / -1; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
.chev { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); transition: transform .2s; }
.wf.open .chev { transform: rotate(180deg); }
.tag { font-family: var(--f-mono); font-size: 11.5px; font-weight: 400; letter-spacing: 0; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.tag.inherit { color: var(--k-workflow); border-color: color-mix(in srgb, var(--k-workflow) 35%, transparent); }
.tag.demo { color: var(--demo); border-color: color-mix(in srgb, var(--demo) 40%, transparent); border-style: dashed; }
.wf-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.wf-meta .flow { font-family: var(--f-mono); font-size: 12px; }
.wf-meta .flow b { color: var(--ink); font-weight: 500; }

/* miniature step strip */
.strip { display: flex; align-items: center; }
.strip .s { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.strip .s.dia { border-radius: 2px; transform: rotate(45deg) scale(.85); }
.strip .s.box { border-radius: 2px; }
.strip .s.ring { background: transparent; border: 2px solid var(--c); }
.strip .s.hook { width: 5px; height: 5px; background: var(--k-hook); opacity: .7; }
.strip .ln { width: 11px; height: 1.5px; background: var(--line); flex: none; }
.strip .gap { width: 7px; }

.wf-body { border-top: 1px solid var(--line); padding: 10px 24px 30px; min-width: 0; }
.wf-body[hidden] { display: none; }

/* lifecycle lanes */
.lane { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 16px 0; font-size: 13px; color: var(--muted); }
.lane + .rail-wrap, .rail-wrap + .lane { border-top: 1px dashed var(--line); }
.lane-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); min-width: 130px; }
.hookchip { font-family: var(--f-mono); font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--sunken); color: var(--ink); white-space: nowrap; }
.hookchip.ext::before { content: "ext · "; color: var(--faint); }
.lane .arrow { color: var(--faint); }
.lane .via { font-size: 12px; color: var(--faint); font-style: italic; }
.handoff-lane .hookchip { background: color-mix(in srgb, var(--k-workflow) 14%, transparent); color: var(--k-workflow); }

/* ---------- Step rail ---------- */
.rail-wrap { position: relative; padding-block: 8px; }
.rail { list-style: none; margin: 0; padding: 0; position: relative; }
.rail::before { content: ""; position: absolute; left: 14px; top: 22px; bottom: 22px; width: 1.5px; background: var(--line); }
.rail.main.has-arcs { margin-left: 34px; }
svg.arcs { position: absolute; left: -34px; top: 0; width: 34px; height: 100%; overflow: visible; pointer-events: none; }
svg.arcs path { fill: none; stroke: var(--k-assess); stroke-width: 1.5; }
svg.arcs path.fwd { stroke-dasharray: 4 4; }
svg.arcs .head { fill: var(--k-assess); stroke: none; }

.step { position: relative; padding: 18px 0 18px 48px; min-width: 0; }
.step + .step { border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); }
.node {
  position: absolute; left: 3px; top: 20px; width: 24px; height: 24px; border-radius: 50%;
  display: grid; place-items: center; background: var(--surface); border: 2px solid var(--c);
  font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; color: var(--c); font-variant-numeric: tabular-nums;
}
.node.dia { border-radius: 4px; transform: rotate(45deg); width: 21px; height: 21px; left: 4.5px; top: 21.5px; }
.node.dia span { transform: rotate(-45deg); }
.node.box { border-radius: 6px; }
.node.fill { background: var(--c); color: var(--surface); }

.step-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-name { font-family: var(--f-display); font-weight: 650; font-size: 17px; letter-spacing: -.005em; }
.kind { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--c); cursor: help; }
.badge { font-size: 11.5px; color: var(--muted); background: var(--sunken); border-radius: 999px; padding: 0 9px; white-space: nowrap; }
.badge.you { color: var(--k-manager); background: color-mix(in srgb, var(--k-manager) 12%, transparent); }
.step-desc { color: var(--muted); font-size: 14px; margin: 6px 0 0; max-width: 72ch; }
.step-desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.more { font-size: 12.5px; color: var(--accent); margin-top: 4px; }
.more:hover { text-decoration: underline; }
.cmd { margin: 8px 0 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); background: var(--sunken); border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: pre; max-width: 100%; }
.cmd .p { color: var(--faint); }
.members { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.members .m { font-family: var(--f-mono); font-size: 12px; background: var(--sunken); color: var(--ink); border-radius: 6px; padding: 2px 8px; }
.choices { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.choice { font-size: 12.5px; border: 1px solid color-mix(in srgb, var(--k-manager) 30%, var(--line)); border-radius: 8px; padding: 3px 10px; color: var(--muted); }
.choice b { color: var(--ink); font-weight: 600; margin-right: 4px; }

/* facts: calm, borderless */
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; align-items: center; }
.fact { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.fact .mono { color: var(--ink); }
.fact svg { color: var(--faint); flex: none; }

.var { font-family: var(--f-mono); font-size: .84em; color: var(--accent); background: var(--accent-soft); padding: 0 4px; border-radius: 4px; white-space: nowrap; }

/* rules pill: deliberately quiet */
.rules-pill {
  font-size: 12px; color: var(--rule); display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px 2px 7px; border-radius: 6px; background: var(--rule-soft); border: 1px solid transparent;
}
button.rules-pill:hover { border-color: color-mix(in srgb, var(--rule) 35%, transparent); }
.rules-pill .sec { font-family: var(--f-display); font-weight: 650; }
.rules-pill .ck { font-family: var(--f-mono); font-size: 10.5px; opacity: .8; }
.hide-rules .rules-pill, .hide-rules .rules-panel, .hide-rules .fact.rulesel { display: none; }

.rules-panel { margin-top: 14px; border-left: 2px solid var(--rule-soft); padding-left: 14px; display: grid; gap: 4px; }
.rules-panel[hidden] { display: none; }
.rule { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 8px 0; }
.rule-glyph { width: 18px; height: 18px; display: grid; place-items: center; color: var(--rule); margin-top: 1px; }
.rule-sum { font-size: 13.5px; color: var(--ink); text-align: left; width: 100%; }
.rule-sum:hover { color: var(--accent); }
.rule-id { font-family: var(--f-mono); font-size: 11px; color: var(--faint); margin-left: 8px; }
.rule-scope { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.scope { font-family: var(--f-mono); font-size: 11px; color: var(--muted); background: var(--sunken); border-radius: 4px; padding: 0 6px; }
.rule-more { margin-top: 8px; font-size: 13px; color: var(--muted); display: grid; gap: 8px; }
.rule-more[hidden] { display: none; }
.rule-more pre { margin: 0; font-family: var(--f-mono); font-size: 12px; background: var(--sunken); color: var(--ink); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; }
.kv span b { font-weight: 500; color: var(--ink); }

/* nested containers: outcomes, items, children, sub-workflows */
.branch { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--sunken) 40%, var(--surface)); padding: 12px 16px 8px; min-width: 0; }
.branch.loop { border-style: dashed; border-color: color-mix(in srgb, var(--k-assess) 45%, var(--line)); }
.branch-head { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.branch-head .lbl { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.branch .rail::before { left: 11px; top: 20px; bottom: 20px; }
.branch .step { padding: 14px 0 14px 36px; }
.branch .node { width: 19px; height: 19px; left: 2px; font-size: 9.5px; top: 17px; }
.branch .node.dia { width: 16px; height: 16px; left: 3.5px; top: 18.5px; }
.branch .step-name { font-size: 15.5px; }

.decision { margin-top: 14px; }
.decision.attached { border-top: 1px dashed var(--line); padding-top: 12px; }
.decision-lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--k-assess); }
.question { font-family: var(--f-display); font-weight: 500; font-size: 16px; color: var(--ink); margin: 4px 0 0; max-width: 66ch; line-height: 1.4; }
.question::before { content: "“"; color: var(--k-assess); margin-right: 1px; }
.question::after { content: "”"; color: var(--k-assess); }
.repeat { margin-top: 10px; display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--k-assess); background: color-mix(in srgb, var(--k-assess) 10%, transparent); border-radius: 8px; padding: 3px 10px; }
.repeat .sub { color: var(--muted); }
.outcomes { display: grid; gap: 0; margin-top: 10px; }
.oc { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 7px 0; align-items: baseline; font-size: 13.5px; }
.oc + .oc { border-top: 1px dotted var(--line); }
.oc-lbl { font-family: var(--f-mono); font-size: 11.5px; color: var(--k-assess); }
.oc-lbl::before { content: "if "; color: var(--faint); }
.oc-what { color: var(--muted); min-width: 0; }
.oc-what b { color: var(--ink); font-weight: 600; }
.oc-what .detail { display: block; font-size: 12.5px; color: var(--faint); margin-top: 2px; }
.oc-what .end { color: var(--ink); }
.oc .branch { margin-top: 0; }
@media (max-width: 560px) { .oc { grid-template-columns: minmax(0, 1fr); gap: 4px; } }

.linkbtn { font-size: 12.5px; color: var(--k-workflow); display: inline-flex; gap: 4px; align-items: center; }
.linkbtn:hover { text-decoration: underline; }
.peek { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 6px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.peek .sep { color: var(--faint); }
.inherited-note { font-size: 12.5px; color: var(--k-workflow); margin: 12px 0 4px; display: flex; gap: 6px; align-items: center; }

/* ---------- Library ---------- */
aside.lib { display: grid; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); min-width: 0; max-height: calc(100vh - 100px); overflow-y: auto; padding-bottom: 8px; }
@media (max-width: 980px) { aside.lib { position: static; max-height: none; overflow: visible; } }
details.shelf { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.shelf > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
details.shelf > summary::-webkit-details-marker { display: none; }
details.shelf > summary h3 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 15.5px; }
details.shelf > summary .n { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
details.shelf[open] > summary { border-bottom: 1px solid var(--line); }
.shelf-body { padding: 6px 16px 14px; display: grid; font-size: 13.5px; min-width: 0; }
.entry { padding: 10px 0; border-bottom: 1px dashed var(--line); min-width: 0; }
.entry:last-child { border-bottom: 0; }
.entry-name { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.entry-desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
.entry-desc.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.used { font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.mini { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.mini.demo { color: var(--demo); border-style: dashed; }
.key { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.key:last-child { border-bottom: 0; }
.key .ico { width: 18px; height: 18px; margin-top: 2px; border: 2px solid var(--c); border-radius: 50%; }
.key .ico.dia { border-radius: 3px; transform: rotate(45deg) scale(.85); }
.key .ico.box { border-radius: 4px; }
.key .ico.fill { background: var(--c); }
.key .ico.arc { border: 0; border-left: 2px solid var(--k-assess); border-top: 2px solid var(--k-assess); border-radius: 10px 0 0 0; }
.key .ico.sec { border: 0; color: var(--rule); font-family: var(--f-display); font-weight: 650; font-size: 17px; line-height: 18px; text-align: center; }
.key b { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--c, var(--ink)); }
.key p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
table.settings { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.settings td { padding: 6px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
table.settings td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
table.settings td:last-child { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }
.settings-scroll { overflow-x: auto; }
.note { font-size: 12px; color: var(--faint); padding: 6px 2px 0; }

.empty { text-align: center; color: var(--muted); padding: 40px 10px; border: 1px dashed var(--line); border-radius: var(--r); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 560px) {
  .lane-label { min-width: 0; width: 100%; }
  .wf-head { padding: 18px 16px; }
  .wf-body { padding: 8px 16px 24px; }
  .wf-name { font-size: 19px; }
}

/* ---------- Tasks ---------- */
:root { --ok: #2F7A3E; --warn: #A15C00; --bad: #B4232F; --ok-soft: #E3F1E6; --warn-soft: #FBEFD9; --bad-soft: #F9E1E3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #7BD08A; --warn: #F2B65A; --bad: #FF8D96; --ok-soft: #17301F; --warn-soft: #34270F; --bad-soft: #3A1A1F; } }
:root[data-theme="dark"] { --ok: #7BD08A; --warn: #F2B65A; --bad: #FF8D96; --ok-soft: #17301F; --warn-soft: #34270F; --bad-soft: #3A1A1F; }

/* tabs in the header */
.tabs { display: flex; gap: 4px; align-items: flex-end; margin-top: 30px; flex-wrap: wrap; }
.tab { font-family: var(--f-display); font-weight: 650; font-size: 16px; padding: 10px 16px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-n { font-family: var(--f-mono); font-size: 11.5px; font-weight: 400; color: var(--faint); margin-left: 4px; }
.live { margin-left: auto; align-self: center; font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; padding-bottom: 6px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (max-width: 640px) { .live { margin-left: 0; width: 100%; padding: 4px 0 10px; } }

/* tasks layout */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .7; margin-left: 4px; }
.tasks-main { display: grid; grid-template-columns: 370px minmax(0, 1fr); gap: 32px; padding-block: 28px 72px; align-items: start; }
@media (max-width: 980px) { .tasks-main { grid-template-columns: minmax(0, 1fr); } }

.tlist { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 96px); overflow-y: auto; padding: 2px 4px 8px 2px; min-width: 0; }
@media (max-width: 980px) { .tlist { position: static; max-height: 420px; } }
.trow { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.trow:hover { border-color: color-mix(in srgb, var(--faint) 60%, var(--line)); }
.trow[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.trow-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trow-id { font-family: var(--f-display); font-weight: 650; font-size: 15.5px; }
.trow-wf { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.trow-when { margin-left: auto; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.trow-sum { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trow.unreadable { background: transparent; border-style: dashed; }
.trow.unreadable .trow-id { color: var(--faint); }
.group-label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 2px 2px; }

.status { font-size: 11.5px; font-weight: 500; border-radius: 999px; padding: 1px 9px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-completed { color: var(--ok); background: var(--ok-soft); }
.st-in_progress { color: var(--accent); background: var(--accent-soft); }
.st-in_progress::before { animation: pulse 2.4s infinite; }
.st-awaiting_operator { color: var(--warn); background: var(--warn-soft); }
.st-failed { color: var(--bad); background: var(--bad-soft); }
.st-pending, .st-skipped, .st-direct, .st-unreadable { color: var(--muted); background: var(--sunken); }

/* detail */
.tdetail { min-width: 0; display: grid; gap: 22px; }
.td-head { display: grid; gap: 10px; }
.td-title { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.td-title h2 { margin: 0; font-family: var(--f-display); font-weight: 750; font-size: 34px; letter-spacing: -.02em; line-height: 1.1; }
.td-sub { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
.td-sub .mono { color: var(--ink); }
.outcome { font-size: 15px; color: var(--ink); max-width: 72ch; margin: 0; line-height: 1.65; }
.outcome-lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
details.panel > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; gap: 10px; align-items: baseline; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary h3 { margin: 0; font-family: var(--f-display); font-weight: 650; font-size: 16px; }
details.panel > summary .n { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
details.panel > summary .chev { margin-left: auto; width: 24px; height: 24px; }
details.panel[open] > summary .chev { transform: rotate(180deg); }
details.panel[open] > summary { border-bottom: 1px solid var(--line); }
.panel-body { padding: 8px 18px 16px; min-width: 0; }
.quiet { color: var(--faint); font-size: 13px; padding: 8px 0; }
.commits { display: grid; gap: 6px; }
.commit { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; font-size: 13px; align-items: baseline; }
.commit .h { font-family: var(--f-mono); font-size: 12px; color: var(--accent); }
.dw { padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.dw:last-child { border-bottom: 0; }
.dw time { font-family: var(--f-mono); font-size: 11.5px; color: var(--faint); display: block; }

/* runs */
.run { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.run-head { padding: 16px 20px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.run-title { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.run-title b { font-family: var(--f-display); font-weight: 650; font-size: 18px; }
.run-title .rid { font-family: var(--f-mono); font-size: 12px; color: var(--faint); }
.run-title .linkbtn { margin-left: auto; }
.run-meta { display: flex; gap: 4px 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.run-meta .mono { color: var(--ink); }
.run-body { padding: 6px 20px 16px; }
.phase-lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 0 4px; }
.irow { display: grid; grid-template-columns: 20px minmax(0, 1fr) minmax(90px, 160px); gap: 4px 12px; padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--line) 55%, transparent); align-items: start; }
.phase-lbl + .irow { border-top: 0; }
.ist { width: 18px; height: 18px; display: grid; place-items: center; margin-top: 2px; }
.ist svg { display: block; }
.iname { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.iname b { font-family: var(--f-display); font-weight: 650; font-size: 15px; }
.iname.hook b { font-family: var(--f-mono); font-weight: 500; font-size: 13px; }
.owner { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.round { font-size: 11.5px; color: var(--k-assess); background: color-mix(in srgb, var(--k-assess) 10%, transparent); border-radius: 999px; padding: 0 8px; }
.isum { grid-column: 2 / 4; font-size: 13px; color: var(--muted); max-width: 76ch; }
.isum.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ires { grid-column: 2 / 4; font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.iact { grid-column: 2 / 4; display: flex; gap: 14px; flex-wrap: wrap; margin-top: 2px; }
.iact button { font-size: 12.5px; color: var(--accent); }
.iact button:hover { text-decoration: underline; }
.timing { display: grid; gap: 4px; justify-items: end; }
.dur { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 100%; height: 4px; border-radius: 2px; background: var(--sunken); position: relative; overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: var(--c, var(--accent)); min-width: 2px; }
@media (max-width: 560px) { .irow { grid-template-columns: 20px minmax(0, 1fr); } .timing { grid-column: 2; justify-items: start; } .bar { max-width: 160px; } }

/* artifact drawer */
.scrim { position: fixed; inset: 0; background: rgb(10 14 26 / .35); z-index: 20; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(760px, 100%);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -20px 0 60px -30px rgb(0 0 0 / .4);
  display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
.drawer-head .path { font-family: var(--f-mono); font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.drawer-head b { font-family: var(--f-display); font-weight: 650; font-size: 17px; display: block; }
.drawer-head .x { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.md { overflow-y: auto; padding: 18px 26px 40px; font-size: 14.5px; line-height: 1.65; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--f-display); font-weight: 650; line-height: 1.25; margin: 1.4em 0 .4em; text-wrap: balance; }
.md h1 { font-size: 24px; margin-top: .4em; } .md h2 { font-size: 19px; } .md h3 { font-size: 16px; } .md h4 { font-size: 14.5px; }
.md p { margin: .6em 0; max-width: 72ch; }
.md ul, .md ol { padding-left: 1.3em; margin: .5em 0; max-width: 72ch; }
.md li { margin: .25em 0; }
.md code { background: var(--sunken); border-radius: 4px; padding: 0 4px; }
.md pre { background: var(--sunken); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 12.5px; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: .6em 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.md .trunc { color: var(--faint); font-size: 12.5px; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 18px; }

/* ---------- Live page additions ---------- */
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tag.builtin, .mini.builtin { color: var(--demo); border-color: color-mix(in srgb, var(--demo) 40%, transparent); border-style: dashed; }
.hookchip.builtin { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.builtin-label { margin-top: 18px; }
.banner { background: var(--bad-soft); color: var(--bad); border-radius: var(--r); padding: 12px 16px; margin-bottom: 18px; font-size: 14px; overflow-wrap: anywhere; }
.live.off .pulse { background: var(--faint); animation: none; }
.trow.child { margin-left: 18px; width: calc(100% - 18px); }
.irow.current { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); border-radius: 8px; padding-inline: 8px; margin-inline: -8px; }
.irow.builtin .iname b { color: var(--muted); }
.ipanel { grid-column: 2 / 4; min-width: 0; }
.iact { align-items: center; }
.iact .rules-pill { color: var(--rule); }
.rstat { font-size: 11px; font-weight: 500; border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.rstat.ok { color: var(--ok); background: var(--ok-soft); }
.rstat.bad { color: var(--bad); background: var(--bad-soft); }
.rstat.warn { color: var(--warn); background: var(--warn-soft); }
.rstat.muted { color: var(--muted); background: var(--sunken); }
.rs-ok { color: var(--ok); } .rs-bad { color: var(--bad); } .rs-warn { color: var(--warn); }
.rule-sum { display: inline; }
.fails { margin: 4px 0 0; padding-left: 1.2em; font-size: 12.5px; color: var(--bad); }
.attempts { display: grid; gap: 6px; margin-top: 8px; }
details.attempt { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-top: 10px; font-size: 13px; }
details.attempt > summary { cursor: pointer; color: var(--muted); }
details.attempt[open] > summary { margin-bottom: 6px; }
.check { padding: 6px 0; border-top: 1px dotted var(--line); min-width: 0; }
.check pre { margin: 6px 0 0; font-family: var(--f-mono); font-size: 12px; background: var(--sunken); color: var(--ink); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; }
.stopnote { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; }
.run-sum { margin: 2px 0 0; font-size: 13.5px; color: var(--muted); max-width: 76ch; }
.md pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.doc-row { display: flex; gap: 10px; align-items: baseline; }
/* ---------- Steps / YAML switch ---------- */
.wf-switch { display: flex; gap: 4px; align-items: center; padding: 14px 0 6px; flex-wrap: wrap; }
.seg { font-size: 12.5px; font-weight: 500; padding: 5px 12px; border-radius: 7px; color: var(--muted); border: 1px solid transparent; }
.seg:hover:not(:disabled) { color: var(--ink); }
.seg[aria-selected="true"] { background: var(--sunken); color: var(--ink); border-color: var(--line); }
.seg:disabled { opacity: .45; cursor: not-allowed; }
.yaml-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); padding: 8px 2px 6px; }
pre.yaml { margin: 0 0 6px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.6; background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: 16px 18px; overflow-x: auto; tab-size: 2; }
.y-key { color: var(--y-key); } .y-s { color: var(--term-fg); } .y-c { color: var(--term-dim); font-style: italic; }
.y-d, .y-p { color: var(--term-dim); } .y-k, .y-n { color: var(--y-lit); } .y-v { color: var(--y-var); }
.wf-demo { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--accent-soft) 55%, var(--surface)), var(--surface) 140px); }
.tag.demo { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.play-demo { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; color: var(--surface); background: var(--accent); border-radius: 8px; padding: 7px 14px; }
.play-demo:hover { filter: brightness(1.08); }

/* ---------- Tasks: items nested under their step ---------- */
.irow.nested { margin-left: calc(var(--depth) * 26px); padding-left: 12px; border-left: 2px solid color-mix(in srgb, var(--line) 80%, var(--faint)); border-top-color: transparent; }
.irow.nested + .irow:not(.nested) { border-top-color: color-mix(in srgb, var(--line) 55%, transparent); }

/* ---------- Demo player ---------- */
body.no-scroll { overflow: hidden; }
.player { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; place-items: center; }
.p-shell { width: min(1280px, 100%); height: min(860px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
.p-top h2 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 750; font-size: 24px; letter-spacing: -.015em; }
.p-top .x { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; flex: none; }
.p-grid { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 0; }
@media (max-width: 820px) { .p-grid { grid-template-columns: minmax(0, 1fr); } .p-side { display: none; } }
.p-side { border-right: 1px solid var(--line); padding: 18px 20px; overflow-y: auto; }
.p-rail { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.p-step { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 9px; color: var(--muted); transition: background .25s, color .25s; }
.p-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); background: var(--surface); grid-row: span 2; }
.p-name { font-family: var(--f-display); font-weight: 650; font-size: 15px; }
.p-kind { grid-column: 2; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.p-step .round { grid-column: 3; grid-row: 1; }
.p-step.done .p-dot, .p-step.seen .p-dot { background: var(--c); }
.p-step.done { color: var(--ink); }
.p-step.now { background: var(--accent-soft); color: var(--ink); }
.p-step.now .p-dot { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); animation: pulse 2s infinite; }
.p-note { font-size: 12px; color: var(--faint); margin-top: 18px; }
.p-main { padding: 22px 26px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.p-main > * { flex: none; }
.p-say { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 19px; line-height: 1.45; max-width: 64ch; text-wrap: pretty; }
.p-file { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.p-file-head { font-size: 12.5px; color: var(--muted); padding: 6px 12px; background: var(--sunken); display: flex; gap: 6px; align-items: center; }
.p-file pre { margin: 0; padding: 10px 12px; font-family: var(--f-mono); font-size: 12.5px; overflow-x: auto; }
.term { background: var(--term-bg); color: var(--term-fg); border-radius: 12px; overflow: hidden; font-family: var(--f-mono); font-size: 13.5px; }
.term-bar { display: flex; gap: 6px; align-items: center; padding: 9px 12px; background: color-mix(in srgb, var(--term-bg) 80%, var(--term-fg) 8%); }
.term-bar i { width: 9px; height: 9px; border-radius: 50%; background: var(--term-dim); opacity: .55; }
.term-bar span { margin-left: 8px; font-size: 11.5px; color: var(--term-dim); }
.term-line { padding: 12px 16px 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.term-prompt { color: var(--y-key); }
.caret { display: inline-block; width: .55em; height: 1.1em; background: var(--term-fg); vertical-align: -.2em; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.p-refused { font-size: 13.5px; color: var(--bad); background: var(--bad-soft); border-radius: 9px; padding: 8px 12px; }
.p-auto { font-size: 13px; color: var(--k-auto); display: flex; gap: 8px; align-items: center; }
.p-page { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
.p-page-head { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 16px 0; }
.p-page .md { padding: 4px 18px 16px; overflow: visible; font-size: 14px; }
.p-page.rise { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.p-controls { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }
.pbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); border: 1px solid var(--line); flex: none; }
.pbtn.main { width: 44px; height: 44px; background: var(--accent); color: var(--surface); border-color: transparent; }
.pbtn.speed { width: auto; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.p-ticks { flex: 1; display: flex; gap: 4px; align-items: center; min-width: 0; padding: 0 8px; }
.p-tick { flex: 1; height: 6px; border-radius: 3px; background: var(--sunken); min-width: 6px; }
.p-tick.past { background: color-mix(in srgb, var(--accent) 45%, var(--sunken)); }
.p-tick.now { background: var(--accent); }
.p-tick.refused { box-shadow: inset 0 -2px 0 var(--bad); }

.page-error { position: sticky; top: 0; z-index: 30; margin: 0; border-radius: 0; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"><span>ww · visualize</span></div>
    <h1 id="title">ww</h1>
    <p class="lede">Every workflow this project defines, as ww compiles it, and every task that ran through them. The page follows the configuration and the task store as they change.</p>
    <div class="census" id="census"></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-view="workflows" aria-selected="true">Workflows</button>
      <button class="tab" role="tab" type="button" data-view="tasks" aria-selected="false">Tasks <span class="tab-n" id="tabTasksN"></span></button>
      <span class="live" id="live" title="The page reloads its data when a watched file changes"><span class="pulse"></span><span id="liveText">Connecting</span></span>
    </nav>
  </div>
</header>

<div id="view-workflows" class="view">
  <div class="toolbar">
    <div class="wrap">
      <label class="search" for="q">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="q" type="search" placeholder="Find a workflow, step, handler or rule" autocomplete="off">
      </label>
      <button class="tbtn" id="expandAll" type="button">Expand all</button>
      <button class="tbtn" id="collapseAll" type="button">Collapse all</button>
      <button class="tbtn" id="toggleRules" type="button" aria-pressed="true">Rules shown</button>
      <button class="tbtn" id="toggleBuiltin" type="button" aria-pressed="false">ww's own workflows hidden</button>
    </div>
  </div>
  <main class="wrap atlas-main">
    <section style="min-width:0">
      <div class="banner" id="atlasError" hidden></div>
      <p class="section-label"><span>Workflows</span><span id="countLabel"></span></p>
      <div class="catalog" id="catalog"><div class="empty">Loading the configuration…</div></div>
    </section>
    <aside class="lib" id="library"></aside>
  </main>
</div>

<div id="view-tasks" class="view" hidden>
  <div class="toolbar">
    <div class="wrap">
      <label class="search" for="tq">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
        <input id="tq" type="search" placeholder="Find a task by ID, workflow or what it did" autocomplete="off">
      </label>
      <div class="chips" id="statusChips"></div>
    </div>
  </div>
  <div class="wrap tasks-main">
    <div class="tlist" id="tlist"><div class="empty">Loading tasks…</div></div>
    <section class="tdetail" id="tdetail"></section>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="ww demo"></div>
<aside class="drawer" id="drawer" hidden aria-label="Artifact"></aside>

<script>
"use strict";
function showFailure(message) {
  let el = document.getElementById("pageError");
  if (!el) { el = document.createElement("div"); el.id = "pageError"; el.className = "banner page-error"; document.body.prepend(el); }
  el.textContent = "The page hit an error: " + message + ". Reload it; if it persists, report it with this message.";
}
window.addEventListener("error", e => showFailure(e.message));
window.addEventListener("unhandledrejection", e => showFailure(e.reason && e.reason.stack ? e.reason.stack.split("\n").slice(0, 2).join(" ") : String(e.reason)));
/* ------------------------------------------------------------------
   ww visualize. All data comes from the local server, which reads it
   through ww's core: /api/atlas, /api/tasks, /api/task?id=, and
   /api/artifact?task=&run=&ref=. /api/events says when to refetch.
------------------------------------------------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const prose = text => esc(text)
  .replace(/\{\{([\w.]+)\}\}/g, '<span class="var">$1</span>')
  .replace(/`([^`]+)`/g, "<code>$1</code>");
const firstSentence = t => ((t || "").match(/^.*?[.!?](\s|$)/) || [t || ""])[0].trim();
const store = {
  get(key, fallback) { try { const v = JSON.parse(localStorage.getItem("ww-visualize-" + key)); return v == null ? fallback : v; } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("ww-visualize-" + key, JSON.stringify(value)); } catch (e) {} }
};
async function getJSON(url) {
  const response = await fetch(url, { cache: "no-store" });
  const body = await response.json();
  if (!response.ok) throw new Error(body.error || response.statusText);
  return body;
}

const ICON = {
  play: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>',
  pause: '<svg width="12" height="12" viewBox="0 0 12 12"><rect x="2.5" y="1.5" width="2.5" height="9" rx=".5" fill="currentColor"/><rect x="7" y="1.5" width="2.5" height="9" rx=".5" fill="currentColor"/></svg>',
  prev: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M9.5 1.5v9L3 6z" fill="currentColor"/><rect x="1.5" y="1.5" width="1.6" height="9" fill="currentColor"/></svg>',
  next: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 1.5v9L9 6z" fill="currentColor"/><rect x="8.9" y="1.5" width="1.6" height="9" fill="currentColor"/></svg>',
  restart: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6a4 4 0 1 0 1.2-2.8"/><path d="M2.5 1v2.5H5"/></svg>',
  chev: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5l3 3 3-3"/></svg>',
  from: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 6H2M5 3L2 6l3 3"/></svg>',
  save: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 2h6l2 2v6H2z"/><path d="M4 2v3h4V2"/></svg>',
  hook: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 1v6a2.5 2.5 0 1 1-5 0"/></svg>',
  gear: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="2"/><path d="M6 .8v1.6M6 9.6v1.6M.8 6h1.6M9.6 6h1.6M2.3 2.3l1.1 1.1M8.6 8.6l1.1 1.1M2.3 9.7l1.1-1.1M8.6 3.4l1.1-1.1"/></svg>',
  back: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2L1.5 4.5 4 7"/><path d="M1.5 4.5H7a3.5 3.5 0 0 1 0 7H5"/></svg>',
  fwd: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 1.5"><path d="M1 6h9"/><path d="M7.5 3L10.5 6 7.5 9" stroke-dasharray="none"/></svg>',
  loop: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 6a4 4 0 1 1-1.2-2.8"/><path d="M9.5 1v2.5H7"/></svg>',
  stop: '<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.5" fill="currentColor"/></svg>',
  judged: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="5.5" r="3"/><path d="M2.5 12.5c.8-2.2 2.5-3.2 4.5-3.2s3.7 1 4.5 3.2"/></svg>',
  checked: '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="11" height="9" rx="1.5"/><path d="M4 6l1.6 1.4L4 8.8M7.2 9h2.6"/></svg>',
  arrow: '<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h8M7 3l3 3-3 3"/></svg>'
};

/* ================================================================
   Workflows
================================================================ */
const KINDS = {
  worker:   { label: "worker",    color: "var(--k-worker)",   shape: "",      about: "An agent does the step. In the auto runtime the manager can hand it to a separate worker session with its own model and profile." },
  manager:  { label: "manager",   color: "var(--k-manager)",  shape: " fill", about: "The session that runs the task does the step itself and never delegates it. Steps that talk with you are always manager steps." },
  auto:     { label: "automatic", color: "var(--k-auto)",     shape: " box",  about: "ww runs a command, a handler group or an extension itself. An agent is involved only to repair a failure marked fix." },
  assess:   { label: "assess",    color: "var(--k-assess)",   shape: " dia",  about: "An agent answers a question; the answer picks what happens next: more steps, a jump, a loop or the end." },
  items:    { label: "items",     color: "var(--k-items)",    shape: " box",  about: "Registers a collection of items, then runs its steps once over the whole collection." },
  children: { label: "children",  color: "var(--k-items)",    shape: " box",  about: "Creates child tasks and runs the stages below once per child, one child at a time." },
  workflow: { label: "workflow",  color: "var(--k-workflow)", shape: " box",  about: "Runs another workflow as the child's own task." },
  handoff:  { label: "hand-off",  color: "var(--k-workflow)", shape: " ring", about: "Ends this workflow and starts another one as the task's next run." },
  group:    { label: "group",     color: "var(--k-group)",    shape: " box",  about: "Groups nested steps under one name." }
};
const STD = ["positive", "negative", "mixed"];
let atlas = null;
let wfByName = {};
let showBuiltin = store.get("builtin", false);
let demoData = null;
let uid = 0;

function walkSteps(steps, fn) {
  (steps || []).forEach(s => {
    fn(s);
    walkSteps(s.steps, fn);
    if (s.items) walkSteps(s.items.steps, fn);
    if (s.children) walkSteps(s.children.steps, fn);
    if (s.assessment) s.assessment.outcomes.forEach(o => walkSteps(o.steps, fn));
  });
}
function countSteps(wf) { let n = 0; walkSteps(wf.steps, () => n++); return n; }
function countRules(wf) { let n = 0; walkSteps(wf.steps, s => n += (s.rules || []).length); return n; }
function topGotos(wf) {
  const top = (wf.steps || []).map(s => s.path), out = [];
  (wf.steps || []).forEach((s, i) => {
    if (!s.assessment) return;
    s.assessment.outcomes.forEach(o => {
      if (!o.goto) return;
      const j = top.indexOf(o.goto.target);
      if (j >= 0) out.push({ from: i, to: j, label: o.label, back: o.goto.direction === "back" });
    });
  });
  return out;
}
const hasLoop = wf => topGotos(wf).some(g => g.back) || (wf.steps || []).some(s => s.assessment && s.assessment.repeat_until);

function renderStrip(wf) {
  const parts = [];
  if (wf.lanes && wf.lanes.before_start.length) parts.push('<span class="s hook"></span><span class="gap"></span>');
  (wf.steps || []).forEach((s, i) => {
    const k = KINDS[s.kind] || KINDS.worker;
    if (i) parts.push('<span class="ln"></span>');
    parts.push(`<span class="s ${k.shape.replace(" fill", "").trim()}" style="--c:${k.color}" title="${esc(s.name)} · ${k.label}"></span>`);
    if (s.assessment && s.assessment.attached) parts.push('<span class="ln" style="width:4px"></span><span class="s dia" style="--c:var(--k-assess);width:7px;height:7px"></span>');
  });
  if (wf.lanes && wf.lanes.before_complete.some(h => !h.builtin)) parts.push('<span class="gap"></span><span class="s hook"></span>');
  return `<span class="strip" aria-hidden="true">${parts.join("")}</span>`;
}
function hookChip(h) {
  const title = h.command ? "$ " + h.command : h.extension || h.description || h.name;
  return `<span class="hookchip${h.extension ? " ext" : ""}${h.builtin ? " builtin" : ""}" title="${esc(title)}">${esc(h.name)}</span>`;
}
function renderLane(wf, key, label) {
  const hooks = (wf.lanes || {})[key] || [];
  const own = hooks.filter(h => !h.builtin), builtin = hooks.filter(h => h.builtin);
  if (!own.length && !builtin.length) return "";
  return `<div class="lane"><span class="lane-label">${label}</span>${own.map(hookChip).join('<span class="arrow">→</span>')}${builtin.length ? `${own.length ? '<span class="arrow">→</span>' : ""}${builtin.map(hookChip).join("")}` : ""}${wf.hooks_from && key === "before_start" && own.length ? `<span class="via">via the ${esc(wf.hooks_from)} lane</span>` : ""}</div>`;
}

function renderRules(rules, key) {
  if (!rules || !rules.length) return { pill: "", panel: "" };
  const checks = rules.filter(r => r.command).length;
  const pill = `<button class="rules-pill" type="button" data-toggle="${key}" aria-expanded="false"><span class="sec">§</span>${rules.length} rule${rules.length > 1 ? "s" : ""}${checks ? `<span class="ck">· ${checks} checked</span>` : ""}</button>`;
  const rows = rules.map((r, i) => {
    const checked = !!r.command;
    const scope = [...(r.paths || []), ...(r.contains_in_diff || []).map(s => `in diff "${s}"`), ...(r.contains_in_file || []).map(s => `in file "${s}"`)];
    const verifier = r.verifier && (r.verifier.model || r.verifier.agent) ? `${r.verifier.model || r.verifier.agent}${r.verifier.reasoning ? " · " + r.verifier.reasoning : ""}` : null;
    return `<div class="rule">
      <span class="rule-glyph" title="${checked ? "Checked by a command when the step completes" : "Judged by a separate verifier"}">${checked ? ICON.checked : ICON.judged}</span>
      <div style="min-width:0">
        <button class="rule-sum" type="button" data-toggle="${key}-r${i}" aria-expanded="false">${prose(r.summary)}<span class="rule-id">${esc(r.id)}</span></button>
        ${scope.length ? `<div class="rule-scope">${scope.map(s => `<span class="scope">${esc(s)}</span>`).join("")}</div>` : ""}
        <div class="rule-more" id="${key}-r${i}" hidden>
          <div>${prose(r.text)}</div>
          ${checked ? `<pre>$ ${esc(r.command)}</pre>` : ""}
          <div class="kv">
            <span>${checked ? "Checked by command" : "Judged by a verifier"}${verifier ? ` <b>${esc(verifier)}</b>` : checked ? "" : " with the step's worker settings"}</span>
            ${checked ? `<span>max fixes <b>${esc(r.max_fixes)}</b></span>` : ""}
            <span>${r.group ? `From group <b>${esc(r.group)}</b>` : "Declared on this step"}${r.source ? ` · ${esc(r.source)}` : ""}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  return { pill, panel: `<div class="rules-panel" id="${key}" hidden>${rows}</div>` };
}

function renderDecision(wf, s) {
  const a = s.assessment;
  let html = `<div class="decision${a.attached ? " attached" : ""}"><div class="decision-lbl">${a.attached ? "then decides" : "asks"}</div><p class="question">${prose(a.question)}</p>`;
  if (a.repeat_until) {
    const limit = atlas.library.settings ? atlas.library.settings.limits.assessments : 5;
    html += `<div class="repeat">${ICON.loop} Repeats until <b>${esc(a.repeat_until)}</b><span class="sub">· same assessor each round · at most ${esc(limit)} rounds</span></div>`;
  }
  const declared = a.outcomes.filter(o => o.steps.length || o.stop || o.goto);
  if (!declared.length) {
    html += `<div class="outcomes"><div class="oc"><span class="oc-lbl">positive</span><span class="oc-what">continue with the next step</span></div>
      <div class="oc"><span class="oc-lbl">negative</span><span class="oc-what"><span class="end">${ICON.stop} end the workflow</span></span></div></div>`;
    return html + "</div>";
  }
  html += '<div class="outcomes">';
  const labels = declared.map(o => o.label);
  for (const o of declared) {
    const loops = a.repeat_until && o.label !== a.repeat_until;
    let what;
    if (o.stop) what = `<span class="end">${ICON.stop} end the workflow</span>, skipping everything after it`;
    else if (o.goto) {
      const g = o.goto;
      what = g.direction === "back"
        ? `${ICON.back} go back to <b>${esc(g.target)}</b> and run again from there`
        : `${ICON.fwd} jump ahead to <b>${esc(g.target)}</b>${g.skipped ? `, skipping ${g.skipped} step${g.skipped > 1 ? "s" : ""}` : ""}`;
      if (g.detail) what += `<span class="detail">with the note “${prose(g.detail)}”</span>`;
    } else {
      what = `<div class="branch${loops ? " loop" : ""}" style="--c:var(--k-assess)">${loops ? `<div class="branch-head"><span class="lbl">${ICON.loop} then asks again</span></div>` : ""}${renderSteps(wf, o.steps)}</div>`;
    }
    html += `<div class="oc"><span class="oc-lbl">${esc(o.label)}</span><span class="oc-what">${what}</span></div>`;
  }
  if (a.repeat_until && !labels.includes(a.repeat_until)) html += `<div class="oc"><span class="oc-lbl">${esc(a.repeat_until)}</span><span class="oc-what">stop repeating and continue</span></div>`;
  const rest = STD.filter(x => !labels.includes(x) && x !== a.repeat_until);
  if (rest.length) html += `<div class="oc"><span class="oc-lbl">${rest.join(" / ")}</span><span class="oc-what">continue with the next step</span></div>`;
  return html + "</div></div>";
}

function renderSteps(wf, steps, main) {
  return `<ol class="rail${main ? " main" : ""}">${steps.map((s, i) => renderStep(wf, s, i)).join("")}</ol>`;
}
function renderStep(wf, s, i) {
  const K = KINDS[s.kind] || KINDS.worker, key = `x${++uid}`;
  const desc = s.description || "";
  const long = desc.length > 170;
  const badges = [];
  if (s.interactive === "conversation") badges.push('<span class="badge you">talks with you</span>');
  if (s.interactive === "page") badges.push('<span class="badge you">you answer on the operator page</span>');
  if (s.handler && s.handler !== s.name) badges.push(`<span class="badge">handler ${esc(s.handler)}</span>`);

  const facts = [];
  if (s.model && s.model !== "auto") facts.push(`<span class="fact">${ICON.gear} <span class="mono">${esc(s.model)}</span>${s.reasoning && s.reasoning !== "auto" ? ` · ${esc(s.reasoning)} reasoning` : ""}</span>`);
  if (s.profile) facts.push(`<span class="fact">profile <span class="mono">${esc(s.profile)}</span></span>`);
  if (s.subagents === false) facts.push('<span class="fact">works alone, no subagents</span>');
  if (s.explicit) facts.push('<span class="fact">explicit: narrates each edit</span>');
  if (s.artifact === false) facts.push('<span class="fact">no artifact</span>');
  if (s.artifact_from) facts.push(`<span class="fact">${ICON.from} reads the artifact of <span class="mono">${esc(s.artifact_from)}</span></span>`);
  (s.variables || []).forEach(v => facts.push(`<span class="fact">sets <span class="var">${esc(v)}</span></span>`));
  (s.saves || []).forEach(t => facts.push(`<span class="fact">${ICON.save} saves <span class="mono">${esc(t)}</span></span>`));
  if (s.on_failure === "fix") facts.push(`<span class="fact">${ICON.hook} on failure an agent repairs it${s.max_fixes ? `, up to ${esc(s.max_fixes)} times` : ""}</span>`);
  (s.hooks || []).forEach(h => facts.push(`<span class="fact" title="${esc(h.description || "")}">${ICON.hook} ${esc(h.phase)} <span class="mono">${esc(h.command || h.extension || h.name)}</span>${h.on_failure === "fix" ? " · failures go back to the worker" : ""}</span>`));
  if (s.selects_rules_for) facts.push(`<span class="fact rulesel"><span style="color:var(--rule)">§</span> chooses the rules of <span class="mono">${esc(s.selects_rules_for.join(", "))}</span></span>`);
  if (s.rules_chosen_by) facts.push(`<span class="fact rulesel"><span style="color:var(--rule)">§</span> rules chosen by <span class="mono">${esc(s.rules_chosen_by)}</span></span>`);
  const rr = renderRules(s.rules, key);
  if (rr.pill) facts.push(rr.pill);

  let body = "";
  if (desc) body += `<p class="step-desc${long ? " clamp" : ""}" id="${key}-d">${prose(desc)}</p>${long ? `<button class="more" type="button" data-clamp="${key}-d">Read all</button>` : ""}`;
  const members = s.members || [];
  if (members.length === 1 && (members[0].command || members[0].extension)) {
    body += members[0].command ? `<div class="cmd"><span class="p">$ </span>${esc(members[0].command)}</div>` : `<div class="cmd"><span class="p">ext </span>${esc(members[0].extension)}</div>`;
  } else if (members.length > 1) {
    body += `<div class="members">runs in order ${members.map(m => `<span class="m" title="${esc(m.command || m.extension || "")}">${esc(m.command ? "$ " + m.command : m.name)}</span>`).join('<span class="arrow">→</span>')}</div>`;
  }
  if (s.choices && s.choices.length) body += `<div class="choices">${s.choices.map(c => `<span class="choice"><b>${esc(c.label)}</b>${esc(c.description)}</span>`).join("")}</div>`;

  if (s.kind === "workflow" && s.workflow) {
    const sub = wfByName[s.workflow];
    body += `<div class="branch"><div class="branch-head"><span class="lbl" style="--c:var(--k-workflow)">runs workflow</span><b class="mono">${esc(s.workflow)}</b>${sub ? `<button class="linkbtn" type="button" data-goto="${esc(s.workflow)}">Open ${esc(s.workflow)} ${ICON.arrow}</button>` : ""}</div>
      ${sub ? `<div class="peek">${(sub.steps || []).map(x => esc(x.name)).join('<span class="sep">·</span>')}</div>` : ""}</div>`;

  if (s.steps && s.steps.length) body += `<div class="branch">${renderSteps(wf, s.steps)}</div>`;

  return `<li class="step" style="--c:${K.color}" data-step="${esc(s.path)}">
    <span class="node${K.shape}"><span>${i + 1}</span></span>
    <div class="step-top"><span class="step-name">${esc(s.name)}</span><span class="kind" title="${esc(K.about)}">${K.label}</span>${badges.join("")}</div>
    ${body}
    ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
    ${rr.panel}
  </li>`;
}

/* ---------- YAML, as its file has it, highlighted ---------- */
function hlYaml(text) {
  const value = v => {
    if (!v) return "";
    const comment = v.match(/^(.*?)(\s+#.*)$/);
    if (comment && !/["']/.test(comment[1])) return value(comment[1]) + `<span class="y-c">${esc(comment[2])}</span>`;
    if (/^[>|][-+]?\s*$/.test(v)) return `<span class="y-p">${esc(v)}</span>`;
    if (/^(~|null|true|false)$/.test(v.trim())) return `<span class="y-k">${esc(v)}</span>`;
    if (/^-?\d+(\.\d+)?$/.test(v.trim())) return `<span class="y-n">${esc(v)}</span>`;
    if (/^\[.*\]$/.test(v.trim())) return `<span class="y-p">[</span>${esc(v.trim().slice(1, -1)).replace(/("[^"]*"|'[^']*')/g, '<span class="y-s">$1</span>')}<span class="y-p">]</span>`;
    return `<span class="y-s">${esc(v).replace(/\{\{([\w.]+)\}\}/g, '<span class="y-v">{{$1}}</span>')}</span>`;
  };
  return text.replace(/\n$/, "").split("\n").map(line => {
    if (/^\s*#/.test(line)) return `<span class="y-c">${esc(line)}</span>`;
    const m = line.match(/^(\s*)(-\s+)?([^\s:#"'][^:#]*?|"[^"]*"|'[^']*'):(\s+(.*))?$/);
    if (m) return `${m[1]}${m[2] ? `<span class="y-d">${esc(m[2])}</span>` : ""}<span class="y-key">${esc(m[3])}</span><span class="y-p">:</span>${m[4] ? " " + value(m[5]) : ""}`;
    const d = line.match(/^(\s*)(-\s+)(.*)$/);
    if (d) return `${d[1]}<span class="y-d">${esc(d[2])}</span>${value(d[3])}`;
    const t = line.match(/^(\s*)(.*)$/);
    return `${t[1]}<span class="y-s">${esc(t[2]).replace(/\{\{([\w.]+)\}\}/g, '<span class="y-v">{{$1}}</span>')}</span>`;
  }).join("\n");
}

function drawArcs(card) {

  const settings = `<div class="settings-scroll"><table class="settings">${rows.filter(r => r[1] != null).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${prose(v)}</td></tr>`).join("")}</table></div>`;
  const nRules = rulesListing.groups.reduce((n, g) => n + g.rules.length, 0);

    shelf("modes", "Modes and profiles", (lib.modes || []).length + (lib.profiles || []).length, named(lib.modes) + named(lib.profiles), openShelves.includes("modes")) +
    shelf("settings", "Settings", "ww.json", settings, openShelves.includes("settings"));
}

const RULE_CLASS = { "passed": "ok", "verified pass": "ok", "failed": "bad", "check unavailable": "warn", "not applicable": "muted", "left out": "muted", "self-declared": "muted" };

const ms = (a, b) => new Date(b) - new Date(a);
function fmtDur(n) {
  if (n == null || isNaN(n) || n < 0) return "";
  const s = Math.round(n / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return `${m}m ${String(r).padStart(2, "0")}s`;
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`;
}
function ago(iso) {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h ago`;
  const d = Math.round(h / 24);
  return d < 14 ? `${d} d ago` : new Date(iso).toISOString().slice(0, 10);
}
const fmtTime = iso => iso ? new Date(iso).toLocaleString([], { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
const isActive = s => ["in_progress", "awaiting_operator", "awaiting_input", "interrupted", "failed", "pending"].includes(s);

function renderChips() {
  const counts = {};
  tasks.forEach(t => { const k = isActive(t.status) && t.status !== "awaiting_operator" ? "in_progress" : t.status; counts[k] = (counts[k] || 0) + 1; });
  const order = [["all", "All", tasks.length], ["in_progress", "In progress"], ["awaiting_operator", "Waiting for you"], ["completed", "Completed"], ["direct", "Direct work"], ["abandoned", "Abandoned"], ["unreadable", "Unreadable"]];

  }).join("");
}
function taskMatches(t) {
  const group = isActive(t.status) && t.status !== "awaiting_operator" ? "in_progress" : t.status;
  if (taskFilter !== "all" && group !== taskFilter) return false;
  const q = $("#tq").value.trim().toLowerCase();
  return !q || [t.id, ...(t.workflows || []), t.summary, t.current_step].join(" ").toLowerCase().includes(q);
}
function renderTaskList() {
  const rows = tasks.filter(taskMatches).slice().reverse();
  const active = rows.filter(t => isActive(t.status)), rest = rows.filter(t => !isActive(t.status));
  const row = t => {
    const wf = (t.workflows || []).join(" → ") || (t.status === "unreadable" ? "" : "direct work");

      ${t.current_step ? `<span class="trow-wf">at ${esc(t.current_step)}</span>` : ""}
      <span class="trow-sum">${esc(t.summary)}</span></button>`;
  };
  $("#tlist").innerHTML = (active.length ? `<div class="group-label">Active</div>${active.map(row).join("")}` : "") +
    (rest.length ? `<div class="group-label">${active.length ? "History" : "Tasks"}</div>${rest.map(row).join("")}` : "") +
    (!rows.length ? `<div class="empty">${tasks.length ? "No task matches." : "No tasks yet. Start one with ww start."}</div>` : "");
}

function ruleSummaryPill(r, key) {
  const counts = {};
  r.outcomes.filter(o => !SILENT_RULES.has(o.status)).forEach(o => { const c = RULE_CLASS[o.status] || "muted"; counts[c] = (counts[c] || 0) + 1; });
  const parts = [];
  if (!r.outcomes.length) parts.push(`${r.applied.length} to follow`);
  if (counts.ok) parts.push(`<span class="rs-ok">${counts.ok} passed</span>`);
  if (counts.bad) parts.push(`<span class="rs-bad">${counts.bad} failed</span>`);
  if (counts.warn) parts.push(`<span class="rs-warn">${counts.warn} unavailable</span>`);
  if (counts.muted) parts.push(`${counts.muted} self-declared`);
  if (r.fix_attempts) parts.push(`<span class="rs-warn">${r.fix_attempts} rejected</span>`);
  return `<button class="rules-pill" type="button" data-toggle="${key}" aria-expanded="false"><span class="sec">§</span>${parts.join(" · ")}</button>`;
}
function renderItemRules(r, key, task, run) {

      return `<div class="rule"><span class="rule-glyph">${ICON.judged}</span><div style="min-width:0">
        <div class="rule-sum">${prose(firstSentence(v.text))}<span class="rule-id">${esc(v.id)}</span>${verdict ? ` <span class="rstat ${verdict === "pass" ? "ok" : "bad"}">${esc(verdict)}</span>` : ' <span class="rstat muted">waiting</span>'}</div>
        ${v.files && v.files.length ? `<div class="rule-scope">${v.files.map(f => `<span class="scope">${esc(f)}</span>`).join("")}</div>` : ""}

        ${v.previous_failures && v.previous_failures.length ? `<div class="quiet" style="padding:2px 0">failed last round: ${esc(v.previous_failures.join("; "))}</div>` : ""}
      </div></div>`;
    }).join("");

  }

  const shown = r.applied.filter(a => !silent(a));

    return `<div class="rule"><span class="rule-glyph">${a.checked ? ICON.checked : ICON.judged}</span><div style="min-width:0">
      <div class="rule-sum">${prose(a.summary)}<span class="rule-id">${esc(a.id)}${a.hook ? " · hook" : ""}</span>${status ? ` <span class="rstat ${RULE_CLASS[status] || "muted"}">${esc(status)}</span>` : ' <span class="rstat muted">not checked yet</span>'}</div>

    ${rep.results.map(x => `<div class="check"><span class="rstat ${x.status === "passed" ? "ok" : x.status === "failed" ? "bad" : x.status === "unavailable" ? "warn" : "muted"}">${esc(x.status.replace("_", " "))}</span> <span class="mono">${esc(x.id)}</span>${x.exit_code != null ? ` <span class="quiet">exit ${esc(x.exit_code)}</span>` : ""}
      ${x.command ? `<pre>$ ${esc(x.command)}${x.output ? "\n" + esc(x.output) : ""}</pre>` : x.output ? `<pre>${esc(x.output)}</pre>` : ""}</div>`).join("")}</details>`).join("");
  const extra = [
    r.waived.length ? `<div class="quiet">Waived by the operator: ${r.waived.map(w => `<span class="mono">${esc(w.id)}</span> (${esc(w.reason)})`).join(", ")}</div>` : "",
    r.disputes.length ? `<div class="quiet">Disputed: ${r.disputes.map(d => `<span class="mono">${esc(d.check)}</span> — ${esc(d.reason)}`).join("; ")}</div>` : "",

}

function kvRows(obj, prefix = "") {
