# SPDX-License-Identifier: GPL-3.0-or-later
#
# ww's learning and setup workflows. They learn who uses ww and how the
# project works, into five files ww keeps for its own use, and design a
# setup with the operator from them, which ww places with `setup apply`. The
# `ww-*` skills start them; `ww-setup` guides through them on a first use and
# starts `ww-express`, which has no skill of its own.
#
# Every step that writes a learning file starts it with the same remark, so an
# agent that is not doing ww work leaves the file alone. The steps always
# update an existing file in place, so running a workflow again refreshes it.
# None of them commits: the shared files are left for the operator to review
# and commit.
documents:
  - me: >-
      Who the operator is, how they work, and what they expect from agents and
      ww. Personal: kept in the user configuration directory.
    scope: user
  - myrole: >-
      The operator's role in this project: what they are responsible for and
      own, who they work with, what they are measured on, and what they want
      agents to take over or leave to them. Personal to this checkout: kept
      out of version control.
    scope: project
    path: .ww/myrole.md
  - team: >-
      The operator's team: what it does, how it works, its pain points and
      expectations. Shared with the team through the repository.
    scope: project
    path: .ww/team.md
  - company: >-
      The company in short: its domain, size and constraints. Shared with the
      team through the repository.
    scope: project
    path: .ww/company.md
  - project: >-
      How this project's work is organised: tooling, trackers, infrastructure,
      stack, conventions and recurring pitfalls. Shared with the team.
    scope: project
    path: .ww/project.md
  - setup_proposal: >-
      The configuration fragment a ww setup workflow proposes, which ww places
      with `setup apply`.
    path: .ww/tasks/{{ww.task.id}}/setup-proposal.yaml

modes:
  - ww-narrate: >-
      The operator asked to see what ww does while it learns. Before each step,
      tell them in one or two plain sentences what the step does and why; after
      it, say what it found or changed and where.

workflows:
  - name: ww-learn
    description: >-
      Interviews you about yourself, your role here, your team and company
      into me.md, myrole.md, team.md and company.md.
    runtime: single
    restartable: true
    role: manager
    recommended_next_workflow: ww-suggest
    steps:
      - name: choose
        interactive: true
        description: >-
          Tell the operator in a few plain sentences what this workflow does:
          ww asks some questions to learn who they are and how their team and
          company work, so that it can later suggest a setup that fits them.
          The answers go into files ww keeps for its own use:
          {{ww.documents.me}}, which is personal and never leaves their
          machine; {{ww.documents.myrole}}, their role in this project, which
          stays on this machine; and {{ww.documents.team}} and
          {{ww.documents.company}}, which are committed with the project and
          shared with the team. Say which of them exist and which are missing:
          an existing file is updated, not replaced. Then ask what to cover,
          and recommend the choice that covers the missing files ("only me"
          for me.md, "only my role" for myrole.md, "only team and company" for
          team.md or company.md, "everything" when they fall under more than
          one). When the requirements already say what to cover, as ww-setup
          passes them, take that as the answer, say so, and do not ask. Any
          question can be skipped, and every file is shown to them as it is
          written.
        choices:
          - everything: Me, my role in this project, my team and my company.
          - only me: Only me, my working style and what I expect.
          - only my role: Only my role in this project.
          - only team and company: Only my team and my company.
          - not now: Stop here; nothing is written.
      - assess: >-
          Did the operator choose to go on, that is anything other than "not
          now" in the choose step?
      - name: me
        steps:
          - assess:
              question: >-
                Did the operator choose to talk about themselves ("everything"
                or "only me") in the choose step?
              outcomes:
                positive:
                  steps:
                    - name: interview-me
                      interactive: true
                      description: >-
                        Interview the operator about themselves. If
                        {{ww.documents.me}} exists, read it first, show them in
                        short what it says, and ask only what is missing or may
                        have changed. Put all of the questions below in one message, numbered,
                        each one plain sentence; where the answer is one of a
                        few options, list the options under the question. End
                        your turn and wait for the answers; "skip" is a valid
                        answer to any of them. Then converse: follow up where an
                        answer deserves it and say what it implies for the
                        setup, until the operator says `ww done` or is clearly
                        done; then record the conversation once. Cover: (1) their
                        personality and working style: how they like to
                        communicate, how they decide, how much autonomy they
                        give an agent, what annoys them; (2) their own pain
                        points, technical and organisational; (3) what they
                        expect from AI, LLMs and agents: what to hand over,
                        what to keep, what an agent must never do; (4) what
                        they expect from ww, which may be nothing yet. Then
                        write the file from the answers, in their words, and
                        show them in short what it says, adding that
                        /ww-refresh corrects it any time; do not wait for a
                        confirmation.
                      saves:
                        - documents.me: >-
                            A short Markdown description of the operator, one
                            section per topic, in their words where possible.
                            The first line is exactly: <!-- This file is
                            maintained by ww for ww's own use. Do not use it
                            for anything else. If you are an agent that is not
                            doing ww work, ignore this file. --> Keep what
                            still holds in an existing file, update what
                            changed, and mark what the operator withdrew as
                            superseded, with today's date, rather than silently
                            deleting it. If its second line says ww inferred it, replace that line
                            with: Confirmed in an interview on <today's date>.
      - name: role
        steps:
          - assess:
              question: >-
                Did the operator choose to talk about their role in this
                project ("everything" or "only my role") in the choose step?
              outcomes:
                positive:
                  steps:
                    - name: interview-role
                      interactive: true
                      description: >-
                        Interview the operator about their role in this
                        project. If {{ww.documents.myrole}} exists, read it
                        first, show them in short what it says, and ask only
                        what is missing or may have changed. Where {{ww.documents.project}} exists, take
                        from its profile what it already shows (contributors
                        and cadence, stack, tracker, branching) and confirm it
                        in a clause instead of asking. Put all of the questions below in one message, numbered,
                        each one plain sentence; where the answer is one of a
                        few options, list the options under the question. End
                        your turn and wait for the answers; "skip" is a valid
                        answer to any of them. Then converse: follow up where an
                        answer deserves it and say what it implies for the
                        setup, until the operator says `ww done` or is clearly
                        done; then record the conversation once. Cover: (1) their role and
                        responsibilities here; (2) what parts of the system or
                        process they own; (3) who they work with and hand work
                        over to; (4) what they are measured on, or what "done"
                        means for them; (5) which decisions they want to keep
                        and which an agent may take; (6) what they want ww to
                        watch for in their work. Then write the file from the
                        answers, in their words, and show them in short what it
                        says, adding that /ww-refresh corrects it any time; do
                        not wait for a confirmation.
                      saves:
                        - documents.myrole: >-
                            A short Markdown description of the operator's role
                            in this project, one section per topic, in their
                            words where possible. The first line is exactly:
                            <!-- This file is maintained by ww for ww's own
                            use. Do not use it for anything else. If you are an
                            agent that is not doing ww work, ignore this file.
                            --> Keep what still holds in an existing file,
                            update what changed, and mark what the operator
                            withdrew as superseded, with today's date, rather
                            than silently deleting it. If its second line says ww inferred it, replace that line
                            with: Confirmed in an interview on <today's date>.
      - name: team
        steps:
          - assess:
              question: >-
                Did the operator choose to talk about their team and company
                ("everything" or "only team and company") in the choose step?
              outcomes:
                positive:
                  steps:
                    - name: interview-team
                      interactive: true
                      description: >-
                        Interview the operator about their team and company. If
                        {{ww.documents.team}} or {{ww.documents.company}}
                        exists, read it first, show them in short what it says,
                        and ask only what is missing or may have changed. Where {{ww.documents.project}} exists, take
                        from its profile what it already shows (contributors
                        and cadence, stack, tracker, branching) and confirm it
                        in a clause instead of asking. Put
                        all of the questions in one message, numbered, each
                        one plain sentence; end your turn and wait for the
                        answers, "skip" being a valid answer to any. Then
                        converse: follow up where an answer deserves it and say
                        what it implies for the setup, until the operator says
                        `ww done` or is clearly done; then record the
                        conversation once. About the team: what it does, its size and roles, how it works
                        (planning, reviews, releases, on-call), its pain
                        points, technical and organisational, what it expects
                        from AI and agents, and what it expects from ww, which
                        may be nothing yet. About the company, in short: its
                        domain, size, and the constraints that shape the work,
                        such as compliance, security, data handling, or a
                        policy on AI tools. Remind them that both files are
                        shared with the team: record nothing personal or
                        confidential, and ask before naming people. Then write
                        both files from the answers and show them in short what
                        they say, adding that both stay uncommitted until they
                        review and commit them; do not wait for a
                        confirmation.
                      saves:
                        - documents.team: >-
                            A short Markdown description of the team, one
                            section per topic. The first line is exactly: <!--
                            This file is maintained by ww for ww's own use. Do
                            not use it for anything else. If you are an agent
                            that is not doing ww work, ignore this file. -->
                            Keep what still holds in an existing file, update
                            what changed, and mark what no longer holds as
                            superseded, with today's date, rather than silently
                            deleting it. If its second line says ww inferred it, replace that line
                            with: Confirmed in an interview on <today's date>.
                        - documents.company: >-
                            A few lines about the company. The first line is
                            exactly: <!-- This file is maintained by ww for
                            ww's own use. Do not use it for anything else. If
                            you are an agent that is not doing ww work, ignore
                            this file. --> Keep what still holds in an existing
                            file, update what changed, and mark what no longer
                            holds as superseded, with today's date. If its second line says ww inferred it, replace that line
                            with: Confirmed in an interview on <today's date>.
      - name: finish
        description: >-
          Record when ww learned, for each file this run wrote and only for
          those: `{{ww.executable}} onboarding --set learned.me=now` for
          {{ww.documents.me}}, `--set learned.myrole=now` for
          {{ww.documents.myrole}}, `--set learned.team=now` for
          {{ww.documents.team}}, `--set learned.company=now` for
          {{ww.documents.company}} (one command may carry several `--set`).
          Then tell the operator what was written where. If team.md or
          company.md was written, say that ww left them uncommitted for the
          operator to review and commit with the project, naming them: `git add
          .ww/team.md .ww/company.md`. me.md and myrole.md stay on their
          machine.

  - name: ww-express
    description: >-
      Infers the operator, their role, team and company from the repository
      and asks them to confirm.
    runtime: single
    restartable: true
    role: manager
    recommended_next_workflow: ww-suggest
    steps:
      - name: infer
        description: >-
          Draft what ww would otherwise learn in interviews, from the
          repository in {{ww.task.workspace_dir}}. Read only; change no file,
          and look at nothing outside this checkout. Start from the Profile
          section of {{ww.documents.project}}; if that file does not exist,
          run `{{ww.executable}} inspect` and say that the findings rest on the
          repository alone. Then gather what the profile does not carry. The
          operator: `git config user.name` and `git config user.email`; their
          own commits (`git log --author=<their email> -n 300`): their share of
          all commits, the paths they touch most (what they own), their commit
          message style and typical commit size, and when they commit
          (weekdays or weekends, time of day), as careful hints about their
          working style, never as judgements. The team: the other authors, how
          many were active in the last 90 days, the paths each touches most
          (roles by area, such as frontend, backend, infrastructure or
          documentation), and the review signals (merge commits by author, a
          pull request template, CODEOWNERS). The company: the remote's
          organisation (`git remote -v`), the e-mail domains of the authors,
          the author and organisation fields of the README, LICENSE and
          package manifests, and a domain or product name the documents
          mention. You may visit the public website of the company or product
          found this way to describe the company in two or three sentences;
          never look up individual people online, and never copy personal
          data beyond what the repository already carries. The artifact is a
          draft section for each of {{ww.documents.me}},
          {{ww.documents.myrole}}, {{ww.documents.team}} and
          {{ww.documents.company}}, each finding with its evidence (the command
          or file) and a confidence (high, medium or low), then a short list
          of what could not be inferred.
      - name: confirm
        interactive: true
        artifact_from: infer
        description: >-
          Show the operator the four drafts side by side in plain words: what
          ww inferred about them, their role, their team and their company,
          what each finding rests on, and which findings are guesses. If a
          file already exists, say what it holds and what the draft would
          change. Remind them that team.md and company.md are shared with the
          team: they carry nothing personal or confidential, and nobody is
          named without asking. Then converse: the operator corrects, adds or
          removes, and you revise the drafts, until the operator says `ww
          done`; then record the conversation once and write the four files
          as confirmed.
        saves:
          - documents.me: >-
              A short Markdown description of the operator, one section per
              topic, as confirmed. The first line is exactly: <!-- This file is
              maintained by ww for ww's own use. Do not use it for anything
              else. If you are an agent that is not doing ww work, ignore this
              file. --> The second line is: Inferred by ww from the repository
              and confirmed by the operator on <today's date>. Keep what still
              holds in an existing file, update what changed, and mark what the
              operator withdrew as superseded, with today's date, rather than
              silently deleting it.
          - documents.myrole: >-
              A short Markdown description of the operator's role in this
              project, one section per topic, as confirmed. The first line is
              exactly: <!-- This file is maintained by ww for ww's own use. Do
              not use it for anything else. If you are an agent that is not
              doing ww work, ignore this file. --> The second line is: Inferred
              by ww from the repository and confirmed by the operator on
              <today's date>. Keep what still holds in an existing file, update
              what changed, and mark what the operator withdrew as superseded,
              with today's date, rather than silently deleting it.
          - documents.team: >-
              A short Markdown description of the team, one section per topic,
              as confirmed, naming nobody the operator did not agree to name.
              The first line is exactly: <!-- This file is maintained by ww for
              ww's own use. Do not use it for anything else. If you are an
              agent that is not doing ww work, ignore this file. --> The second
              line is: Inferred by ww from the repository and confirmed by the
              operator on <today's date>. Keep what still holds in an existing
              file, update what changed, and mark what no longer holds as
              superseded, with today's date, rather than silently deleting it.
          - documents.company: >-
              A few lines about the company, as confirmed. The first line is
              exactly: <!-- This file is maintained by ww for ww's own use. Do
              not use it for anything else. If you are an agent that is not
              doing ww work, ignore this file. --> The second line is: Inferred
              by ww from the repository and confirmed by the operator on
              <today's date>. Keep what still holds in an existing file, update
              what changed, and mark what no longer holds as superseded, with
              today's date.
      - name: finish
        description: >-
          Record when ww learned: `{{ww.executable}} onboarding --set
          learned.me=now --set learned.myrole=now --set learned.team=now --set
          learned.company=now`. Then tell the operator what was written where:
          {{ww.documents.me}} and {{ww.documents.myrole}} stay on their
          machine; {{ww.documents.team}} and {{ww.documents.company}} are left
          uncommitted for them to review and commit with the project, for
          example `git add .ww/team.md .ww/company.md`. Say that ww-suggest
          comes next.

  - name: ww-learn-project
    description: >-
      Scans how the project's work is organised (branching, verify commands,
      tracker, pitfalls) into project.md.
    runtime: single
    restartable: true
    role: manager
    recommended_next_workflow: ww-learn
    steps:
      - name: scan
        description: >-
          Learn how the project in {{ww.task.workspace_dir}} organises its
          work; ignore what the software does. Read only; change no file.
          First run `{{ww.executable}} inspect` there and take its facts as the
          base, each with the evidence it names or "not found": the default
          and integration branch, the branch patterns, merge or rebase and the
          pull request signals; activity and team shape; the fix share and the
          paths fixes touch; the manifests and their verify commands, each an
          exact argument list such as `npm run lint`; the tracker key prefixes
          with the candidate `task_format`; and the commit convention with the
          candidate `commit_format`. Spend your own reading only on what
          inspect cannot see, naming the file or command for each fact you
          add: how and where commands run, on the host or through a wrapper
          (a container exec such as `docker compose exec app`, a virtual
          environment, a task runner), with the wrapper as an exact argument
          list, and whether each worktree gets its own environment, from the
          Makefile or task runner, the compose and devcontainer files, the CI
          jobs and the agent instructions; what agents are allowed or
          forbidden to do, from the content of
          AGENTS.md, CLAUDE.md and cursor rules; what the pull request template
          and CODEOWNERS demand; the process sections of the README and
          CONTRIBUTING, such as reviews, releases and versioning; the gates the
          CI files enforce; and a verify command a document names that no
          manifest does. Then, briefly, the agent tooling (MCP servers and
          agent settings in .mcp.json, .claude/, .codex/, .cursor/, .gemini/,
          skills and commands) and the stack (languages, frameworks, package
          managers, containers, deployment). If {{ww.documents.project}}
          exists, note what it says that no longer matches. The artifact is
          the inspect profile, then the setup facts with what you added, then
          the other findings.
      - name: history
        description: >-
          Find the mistakes that come back. Read only. Start from the Fixes
          section of the inspect profile: the fix share, the paths fixes touch
          and the recent fix subjects. Read the full messages of those commits
          (`git log --grep` or `git show --stat <commit>`) and, where `gh`,
          `glab` or the tracker's MCP server is configured and signed in, the
          review remarks on recent merged pull requests and what changed in
          response; skip what is not available and say so. A pitfall is the
          same kind of fix, review remark or revert more than once, or a path
          the fixes keep returning to for the same cause; one fix is not a
          pattern. For each, give a candidate rule in one imperative sentence,
          its evidence (the commits or reviews), and, where a one-line command
          could verify it, that command as its check, run the way the scan
          found the project runs its commands. The artifact is the
          list; an empty one is a fine result.
      - name: review
        interactive: true
        description: >-
          Show the operator the setup facts first, each with its evidence or
          "not found", then a short summary of the other findings and the
          candidate rules, and ask whether it is right. Discuss and revise
          until the operator says `ww done`, then record the conversation once
          and write {{ww.documents.project}}. It is shared with the team
          through the repository, so record nothing secret, such as tokens,
          hostnames or credentials.
        choices:
          - looks right: Write project.md as shown.
          - corrected: Write it with the corrections I gave.
        saves:
          - documents.project: >-
              A Markdown description of how the project's work is organised.
              Its first section is "Profile": the inspect profile's Markdown
              trimmed to its Repository, Activity, Fixes, Layout and
              Conventions sections, with at most five paths in any list. Then
              "Setup facts", with one line each for the
              default branch, the integration branch, the branch patterns,
              merge or rebase, required pull requests, the test, lint, type
              check, format check and build commands as exact argument lists,
              how and where commands run (on the host or through which
              wrapper, as an exact argument list, and whether each worktree
              has its own environment), the tracker and its candidate `task_format`, the commit
              convention and its candidate `commit_format`, the CI gates and
              release practice, and what agents are allowed or forbidden to do,
              each with its evidence or "not found". Then sections for agent
              tooling, issue tracking, infrastructure and stack, conventions,
              and recurring pitfalls with their candidate rules. The first line
              is exactly: <!-- This file is maintained by ww for ww's own use.
              Do not use it for anything else. If you are an agent that is not
              doing ww work, ignore this file. --> Keep what still holds in an
              existing file, update what changed, and mark what no longer holds
              as superseded, with today's date, rather than silently deleting
              it.
      - name: finish
        description: >-
          Record when ww learned about the project: `{{ww.executable}}
          onboarding --set learned.project=now`. Then tell the operator that
          {{ww.documents.project}} was left uncommitted for them to review and
          commit with the project: `git add .ww/project.md`.

  - name: ww-suggest
    description: >-
      Designs a setup with you from what ww learned and proposes it in full.
    runtime: single
    restartable: true
    role: manager
    steps:
      - name: gather
        description: >-
          Read what ww knows, skipping a file that does not exist:
          {{ww.documents.me}}, {{ww.documents.myrole}}, {{ww.documents.team}},
          {{ww.documents.company}}, {{ww.documents.project}}. Read the current
          setup: `{{ww.executable}} discover` and `{{ww.executable}} rules
          --json`. When {{ww.documents.project}} has no "Profile" section, or
          does not exist, run `{{ww.executable}} inspect` in
          {{ww.task.workspace_dir}} and take its facts; look up, read only,
          only what neither has, such as what AGENTS.md, CLAUDE.md and cursor
          rules let agents do. The artifact lists every fact a setup decision
          can rest on, each with its evidence or "not found": the branches and
          lanes, the verify commands and how and where they run, the kind of
          work each lane or workflow the operator wants covers (code changes,
          manual testing, reviews, reports), the team shape and cadence, the fix
          signals, the candidate projects, the tracker key and commit
          convention; then the operator's preferences that map to modes,
          operator stops or a review step, whether they work on several tasks
          in parallel, how the team works and its pain points, and what is
          already configured. If {{ww.documents.myrole}} or
          {{ww.documents.project}} does not exist, tell the operator that the
          proposal will be weaker without it and that the next step offers to
          learn first; they may prefer to go on. If none of the five files
          exists, say that the suggestions rest on the checkout alone.
      - name: design
        interactive: true
        description: >-
          Settle with the operator what the setup turns on, in one message:
          numbered items, each one plain sentence with its default and, in a
          clause, the evidence for it, so that the operator only corrects;
          list the options under an item that has a few. What the profile
          already answers is stated as decided, not asked. End your turn and
          wait for the answers; "skip" keeps a default. Then discuss: follow
          up where an answer deserves it and revise the decisions, until the
          operator says `ww done`; then record the conversation once. Cover:
          (1) the integration branch and the lanes, from the branch patterns
          actually present: feature work, plus a hotfix, bugfix or release
          lane only where such branches exist or the operator asks for one,
          and a merge back where there is an integration branch; (2) the
          verify commands and their order, from the manifests, and how they
          run: on the host or through the project's wrapper, in the task's
          worktree when there is one; (3) whether
          agents commit, following the commit convention (yes by default), and
          push (never); (4) a worktree per task: on by default when several
          contributors are active and the operator works on parallel tasks,
          otherwise off; (5) the task ID format, from the tracker key prefixes,
          or ww's generated IDs when there are none; (6) the review: for a solo
          team shape, no interactive review by default but an agent
          self-review step, and for a small team or a team, the operator
          keeping the review in an interactive step by default, an agent review
          loop being the alternative; (7) for each workflow whose work is not
          a plain code change, such as manual testing, the step features it
          uses, proposed as decided where the work calls for them (see the
          propose step): an `items` step for work that splits into cases,
          interactive steps or the operator page for what the operator
          performs or judges, and a document or item fields for a template
          the work fills; (8) the operator's preferences that become modes,
          such as brief updates or asking first, and the decisions that
          become operator stops; (9) only when the layout lists candidate
          projects, `projects`: ask for the paths of the sibling
          repositories, which ww never scans; (10) a rule for a hot path or a
          fix-prone path, only when the Fixes section shows a repeated cause
          there, naming it; (11) last, for whom the setup is: the operator
          alone, in local files kept out of version control, or the team, in
          files committed with the project. If ww-setup.local.yaml exists
          beside ww.yaml, an earlier run set ww up for the operator alone: say
          so, and that this run can share that setup or refine it. If the
          gather step found {{ww.documents.myrole}} or
          {{ww.documents.project}} missing, add to the last item the option to
          learn first. The artifact lists every decision with the fact or
          answer it rests on. The answer to the last item is the choice. On
          "learn first" this run ends; tell the operator to run ww-learn for a
          missing myrole.md and ww-learn-project for a missing project.md, the
          second of which recommends ww-suggest when it completes.
        choices:
          - for me: Set it up for me alone; I can share it later.
          - for the team: Set it up for the team, in the shared files.
          - learn first: Let ww learn what is missing first; nothing changes.
          - not now: Stop here; nothing changes. I can come back later.
      - assess: >-
          Did the operator choose "for me" or "for the team" in the design
          step?
      - name: setup
        steps:
          - name: propose
            interactive: true
            artifact_from: design
            description: >-
              Draft the complete setup from the facts and the design
              decisions, in the shape of the documentation's examples (the Node
              project in ww's documentation/examples.md), sized to the project:
              one test script gets one lane, a handler or two and the git
              settings. Write it to {{ww.documents.setup_proposal}} as a
              fragment with the root keys `workflows`, `modes`, `documents`,
              `handlers`, `hooks` and `rules` in ww's YAML notation, plus
              `settings` for ww.json: `task_format` from the tracker's key (its
              prefix with `digit`), or `explicit` when every task carries the
              tracker's ID; `projects` with the paths the operator gave; under
              `extensions` and `ww/git`, `base_branches` (`default` the
              integration branch, `hotfix` the release branch),
              `branch_name_formats` per lane, `commit_format` after the commit
              convention, `separate_branch: true`, and `worktrees` with
              `worktree_dir` only when chosen; under `rules`, a
              `check_guidance` only when {{ww.documents.project}} records a
              wrapper that commands go through, such as a container: one or two
              sentences telling the verifier that scripts a rule where its
              check must run (through the wrapper, on the task's worktree) and
              when the host may run one; `limits` only on request.


              Hook the `ww/git` handlers to the lanes:
              `ext/ww/git/handlers:is-git-clean`, `start-task-branch` and, with
              worktrees, `create-worktree` before a lane starts, `git-commit`
              before it completes where agents commit; nothing pushes. Give each
              verify command an automatic handler with the exact `argv` or
              `shell`, with no agent prompt or command-running loop. Attach
              these handlers as ordered `before_complete` hooks with
              `on_failure: fix` to the steps that change code, such as
              implement, fix or merge. ww runs the checks when the worker
              completes; only a failed check sends its output back to the
              worker to fix, and ww reruns the checks on completion. Never
              also ask the agent to run these commands or add duplicate
              verification steps. Give each lane a workflow: investigate,
              implement or fix, and the review chosen in design; `inherit` for a
              lane that differs only in its base branch, a `merge-to-<integration
              branch>` lane where there is one, and `recommended_next_workflow`
              where lanes chain.


              Every command the fragment carries, a handler's step, a hook's
              `argv` or `shell`, a rule's check and a script, runs the way
              the project runs its commands: ww runs it from the step's
              directory, the task's worktree when worktrees are on, so write
              it for that directory, through the project's wrapper where it
              has one, following the `check_guidance` that `{{ww.executable}}
              rules --json` shows when it is set, and never name the main
              checkout's absolute path or `cd` out of it.


              Fit each workflow's steps to its kind of work with ww's step
              features, and propose them without waiting to be asked: work
              that splits into cases of one kind, such as test cases, review
              comments or tickets, is an `items` step (`items:` with
              `steps:` stages, `persistent: true` when the same cases return
              each round); what the operator performs or judges, such as
              running a manual test, is `interactive: true`, or, per item,
              `interactive: page` with `choices` (for example `pass` and
              `fail`) so the operator answers every case on one page; a
              structure the work fills each time, such as a test case
              template or a report, is a `documents` entry the step `saves`,
              and per-item values are `item.field.<name>` entries of
              `saves`; work repeated until a condition holds is a `loop`
              with a `break`. A plain code lane needs none of them.


              Choose one place for each automated check; never repeat a
              step's check at `before_complete_workflow`. Use a workflow
              boundary check only when it belongs at that boundary rather
              than on a code-changing step. Add a mode only for a preference that
              changes how an agent works, and rules only for conventions no
              command checks, on the steps they govern, with a one-line check
              where one exists; a rule never restates its step, a preference or
              a command, and a step that needs none gets none. Never redefine a
              workflow ww ships (`catchall`, `ww-*`), duplicate what is
              configured, or edit ww's configuration files yourself.


              Run `{{ww.executable}} setup apply {{ww.documents.setup_proposal}}
              --for <me or team, as chosen in design> --dry-run` and fix the
              fragment until it passes. Present it section by section
              (settings, handlers, workflows, hooks, modes, rules), each piece
              with its evidence in one clause, such as "`hotfix` lane: 14
              `hotfix/*` branches merged this year" or "`run-tests` runs `npm
              test`: `package.json` scripts", then the dry run's changes. Then
              walk through the main lane: its steps in order with what an agent
              does at each and where ww runs checks automatically without an
              agent prompt, from the fragment, in ten lines or fewer. Ask
              whether to apply it; discuss and take changes, checking and
              showing it again, until the operator says `ww done`; then record
              the conversation once with their pick, apply or cancel.
            choices:
              - apply: Apply it as shown.
              - cancel: Do not apply anything.
            saves:
              - documents.setup_proposal: >-
                  The setup fragment as the operator last saw it.
          - assess: Did the operator choose "apply" in the propose step?
          - name: apply
            description: >-
              Place the setup the operator agreed to: `{{ww.executable}} setup
              apply {{ww.documents.setup_proposal}} --for <me or team, as
              chosen in design> --yes`. Then run `{{ww.executable}} lint` and
              show its result, and run `{{ww.executable}} plan --workflow <the
              main lane> --agent <your agent>` and show the operator its first
              step's page as "what an agent gets on the first task". Tell the
              operator which files changed, naming
              each as the output lists it. For the team, they are
              ww-setup.yaml, ww.yaml and ww.json, left uncommitted: remind the
              operator to review and commit them, for example `git add
              ww-setup.yaml ww.yaml ww.json`. For the operator alone, they are
              local files and nothing is committed; running ww-suggest again
              and choosing the team offers the same setup to the team. If
              `setup apply` refuses, show its message and stop; never place the
              configuration another way.

  - name: ww-solve
    description: >-
      Turns a problem you describe into proposed workflows, modes, rules or
      hooks.
    runtime: single
    restartable: true
    role: manager
    steps:
      - name: listen
        interactive: true
        description: >-
          Ask the operator to describe the problem: what goes wrong, how often,
          and what it costs them. Ask a few clarifying questions, one at a
          time, then restate the problem in two or three sentences and ask
          whether that is it.
      - name: propose
        interactive: true
        description: >-
          Read what ww knows, skipping a file that does not exist:
          {{ww.documents.me}}, {{ww.documents.myrole}}, {{ww.documents.team}},
          {{ww.documents.company}}, {{ww.documents.project}}; and the current
          setup: `{{ww.executable}} discover` and `{{ww.executable}} rules
          --json`. Propose the smallest change that addresses the problem: a
          workflow or a step, a mode, a rule, a hook, or a setting. Weigh the
          operator's role: what they own gets rules and checks, what they hand
          over gets handoffs, and decisions they keep become operator stops or
          interactive steps. Where the problem is about a kind of work, use
          the step features that fit it: an `items` step for work that
          splits into cases, `interactive: true` or, per item,
          `interactive: page` with `choices` for what the operator performs
          or judges, such as a manual test, a `documents` entry or
          `item.field.<name>` saves for a template the work fills, and a
          `loop` with a `break` for work repeated until a condition holds.
          Write every command it carries, a hook's `argv` or `shell`, a
          rule's check or a script, for the step's directory, the task's
          worktree when worktrees are on, through the project's wrapper as
          {{ww.documents.project}} records it and as the `check_guidance` of
          `{{ww.executable}} rules --json` says when it is set, never with
          the main checkout's absolute path. Write it as a setup fragment to
          {{ww.documents.setup_proposal}} (the root keys `workflows`, `modes`,
          `documents`, `handlers`, `hooks`, `rules` and `settings`; rules as
          literal sentences in the `rules` lists of the steps they govern). A
          fragment cannot change a workflow that ww.yaml
          defines itself: for such a change propose a hook filtered to its
          steps, or show the operator the exact YAML to change by hand. Never
          edit ww's configuration files yourself. Check the fragment with
          `{{ww.executable}} setup apply {{ww.documents.setup_proposal}} --for
          me --dry-run` until it passes. Show the operator what each piece does
          and why, with the dry run's list of changes, and ask where to apply
          it.
        choices:
          - for me: Apply it to my local setup.
          - for the team: Apply it to the shared setup.
          - cancel: Do not apply anything.
        saves:
          - documents.setup_proposal: >-
              The setup fragment as the operator last saw it.
      - assess: >-
          Did the operator choose "for me" or "for the team" in the propose
          step?
      - name: apply
        description: >-
          Place the change: `{{ww.executable}} setup apply
          {{ww.documents.setup_proposal}} --for <me or team, as chosen> --yes`,
          then run `{{ww.executable}} lint` and show its result. Tell the
          operator which files changed; shared ones are left uncommitted for
          them to review and commit. If `setup apply` refuses, show its message
          and stop; never place the configuration another way.

  - name: ww-rules-from-artifacts
    description: >-
      Proposes rules from the lessons that recur in chosen steps' past results.
    runtime: single
    restartable: true
    role: manager
    steps:
      - name: choose
        interactive: true
        description: >-
          Run `{{ww.executable}} discover` and list the workflows and their
          steps. Ask the operator which steps' results to learn from (review
          and fix steps are good sources) and how many recent tasks to read;
          ten is a sensible default. Offer the step names through your question
          tool.
      - name: read
        description: >-
          Find the recent tasks that ran the chosen steps: the task directories
          under `.ww/tasks/` at the project root, newest first, and for each
          `{{ww.executable}} artifacts <task-id>` (add `--run <run-id>` for an
          earlier run). Read only the artifacts of the chosen steps. Collect
          the lessons that recur in more than one task, such as the same review
          finding or the same fix, and skip one-off defects. Read
          `{{ww.executable}} rules --json` and drop lessons an existing rule
          already covers. Read {{ww.documents.me}}, {{ww.documents.myrole}},
          {{ww.documents.team}}, {{ww.documents.company}} and
          {{ww.documents.project}} where they exist, and keep each lesson
          within what they say: the operator's role and the team's conventions
          decide what a rule may demand. The artifact lists each lesson with
          the tasks that show it.
      - name: propose
        interactive: true
        description: >-
          Turn each lesson into a candidate rule: one imperative sentence, with
          a `paths` glob only when it is about a kind of file, and a check only
          when it is an obvious one-line command, written for the step's
          directory (the task's worktree when there is one) and run through
          the project's wrapper as {{ww.documents.project}} records it,
          following the `check_guidance` of `{{ww.executable}} rules --json`
          when it is set. Choose the rule group it
          belongs to from `{{ww.executable}} rules --json`, or a new group with
          the workflows and steps it concerns. Show the operator all candidates
          in one block, each with its group, the steps it will reach, and the
          evidence, and ask which to add. Keep them few and gentle.
        choices:
          - add all: Add every rule shown.
          - add some: Add the ones I named.
          - none: Add nothing.
      - assess: Did the operator choose to add any rule in the propose step?
      - name: add
        description: >-
          Add the rules the operator accepted, only through ww's rule commands,
          each checked with `--dry-run` first: a new group with
          `{{ww.executable}} rules add --group <name> --dir <path> [--workflows
          <name>...] [--steps <name>...]`, then each rule with
          `{{ww.executable}} rules add <group> --text "<sentence>" [--paths
          <glob>...]`. Never edit a rule file or ww's configuration files
          yourself; report a refusal instead of working around it. Run
          `{{ww.executable}} lint`, show where each rule now applies, and tell
          the operator that the new rule files and ww-rules.yaml are left
          uncommitted for them to review and commit.

  - name: ww-automate
    description: >-
      Proposes a script for a step's mechanical work, and the handler that runs
      it.
    runtime: single
    restartable: true
    role: manager
    steps:
      - name: choose
        interactive: true
        description: >-
          Run `{{ww.executable}} discover` and list the workflows and their
          steps. Ask the operator which step to look at, offering the step
          names through your blocking question tool or as a numbered list in
          the chat.
      - name: analyse
        description: >-
          Read the chosen step's instruction (`{{ww.executable}} plan
          --workflow <workflow> --agent <your agent>`) and what it produced in
          recent tasks (`{{ww.executable}} artifacts <task-id>` for the task
          directories under `.ww/tasks/` at the project root). Decide which
          parts of its work are mechanical, the same every time and needing no
          judgement: running commands, collecting or reformatting data, filling
          a template, checking a condition. The artifact says what could be a
          script, what must stay with an agent, and whether the script would
          replace the step or run as a hook before or after it. Read
          {{ww.documents.me}}, {{ww.documents.myrole}}, {{ww.documents.team}},
          {{ww.documents.company}} and {{ww.documents.project}} where they
          exist, and keep the proposal within what they say: the operator's
          role and the team's conventions decide what a script may automate.
          If nothing is mechanical, say so; that is a fine result.
      - name: propose
        interactive: true
        description: >-
          If the analysis found nothing to automate, tell the operator and
          offer only "cancel". Otherwise draft the script (shell or the
          project's own language, small, with a clear exit status) and the
          handler change as a setup fragment in
          {{ww.documents.setup_proposal}}: a hook that runs it, filtered to the
          workflow and step with `workflows` and `steps`, or, for a workflow
          ww-setup.yaml defines, that workflow with the step turned into an
          `argv` or `shell` step. A fragment cannot change a workflow that
          ww.yaml defines itself; for that, show the operator
          the exact YAML to change by hand. Never edit ww's configuration files
          yourself. ww runs the script from the step's directory, the task's
          worktree when worktrees are on: write it for that directory, run
          the project's tools through its wrapper as
          {{ww.documents.project}} records it, and never name the main
          checkout's absolute path. Check the fragment with
          `{{ww.executable}} setup apply {{ww.documents.setup_proposal}} --for
          me --dry-run`. Show the operator the script, where it would live, and the dry run's list of
          changes, and ask where to apply it.
        choices:
          - for me: Apply it to my local setup.
          - for the team: Apply it to the shared setup.
          - cancel: Do not apply anything.
        saves:
          - documents.setup_proposal: >-
              The setup fragment as the operator last saw it.
      - assess: >-
          Did the operator choose "for me" or "for the team" in the propose
          step?
      - name: apply
        description: >-
          Write the script where the operator agreed, make it executable, and
          run it once on a harmless input if it has one. Then place the handler
          change: `{{ww.executable}} setup apply
          {{ww.documents.setup_proposal}} --for <me or team, as chosen> --yes`,
          and run `{{ww.executable}} lint`. Tell the operator which files
          changed and that they are left uncommitted for them to review and
          commit. If `setup apply` refuses, show its message and stop.
