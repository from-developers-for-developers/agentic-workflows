name: Publish development snapshot

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/release-gates.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Stamp the upcoming release's development version
        run: python scripts/set_dev_version.py --base-version 1.0.0 --run-number "$GITHUB_RUN_NUMBER"
      # The distribution check imports ww from the checkout, so it needs the
      # runtime dependencies as well as the build tools.
      - run: python -m pip install build twine .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py --dist-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: pypi-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-distributions
          path: dist
      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # A rerun keeps the version and can finish a partially uploaded release.
          skip-existing: true
