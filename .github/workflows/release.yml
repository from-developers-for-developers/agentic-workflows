name: Release

# Every push to main that changes packaged files (src/, ext/, pyproject.toml)
# releases the next version of pyproject.toml's series, chosen from what PyPI
# holds (scripts/release_version.py), and tags the commit with it. Any other
# push releases nothing.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/release-gates.yml

  build:
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Find whether the push changed packaged files
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch, or a history rewrite, has no usable "before": release.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" -- src ext pyproject.toml | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::This push changed nothing under src/, ext/ or pyproject.toml."
          fi
      - name: Choose and stamp the release version
        id: version
        if: steps.changes.outputs.release == 'true'
        run: |
          version=$(python scripts/release_version.py --stamp)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice title=Releasing::ww-agentic-workflows $version"
      # The distribution check imports ww from the checkout, so it needs the
      # runtime dependencies as well as the build tools.
      - if: steps.changes.outputs.release == 'true'
        run: python -m pip install build twine .
      - if: steps.changes.outputs.release == 'true'
        run: python -m build
      - if: steps.changes.outputs.release == 'true'
        run: python -m twine check --strict dist/*
      - if: steps.changes.outputs.release == 'true'
        run: python scripts/check_distribution.py --dist-dir dist
      - if: steps.changes.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: build
    if: needs.build.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish the validated distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # A rerun keeps the version and can finish a partially uploaded release.
          skip-existing: true

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the released commit
        env:
          TAG: v${{ needs.build.outputs.version }}
        run: |
          # A rerun after the tag was pushed has nothing left to do.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
